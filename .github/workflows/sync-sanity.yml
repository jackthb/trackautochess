name: Sync Sanity CMS

on:
  schedule:
    # Once daily at 06:00 UTC
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

concurrency:
  group: sync-sanity
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase-before-push below has something to
          # rebase onto (default shallow depth=1 can't rebase).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull from Sanity
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: production
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: pnpm pull

      - name: Check for changes
        id: diff
        working-directory: .
        run: |
          git diff --quiet data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        working-directory: .
        run: |
          git config user.name "jackthb"
          git config user.email "19895932+jackthb@users.noreply.github.com"
          git add data/
          git commit -m "Auto-sync game data from Sanity CMS"
          # Rebase-and-retry: another push to main (app/CI commits never touch
          # data/, so this rebases cleanly) can win the race between our fetch
          # and push. Retry a few times instead of failing the run.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed (main moved?), retrying in 5s…"
            sleep 5
          done
          echo "::error::failed to push Sanity sync after 5 attempts" >&2
          exit 1
