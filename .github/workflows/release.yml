name: Build Draft Release Candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check release tag matches desktop version
        run: node scripts/verify-desktop-release.mjs --version-only

      - name: Refuse to modify an already published release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: context.ref.replace('refs/tags/', '')
              });
              if (!release.draft) core.setFailed('This tag is already published. Create a new version for a new candidate.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/backend

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Build Electron app & installer
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir app run build:backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir app run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:desktop:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test release artifact validation
        run: node --test scripts/verify-desktop-release.test.mjs

      - name: Verify installer and updater files and write checksums
        id: artifacts
        run: node scripts/verify-desktop-release.mjs

      # Publication is a separate, manual step after candidate testing and approval.
      - name: Upload draft release candidate
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: ${{ steps.artifacts.outputs.files }}
          generate_release_notes: true
