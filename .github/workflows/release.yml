name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/backend/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r app/backend/requirements.txt

      - name: Cache portable Tesseract
        id: tesseract-cache
        uses: actions/cache@v4
        with:
          path: tesseract-portable
          key: tesseract-portable-5.5.0.20241111-eng-rus

      - name: Download & extract portable Tesseract
        if: steps.tesseract-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-5.5.0.20241111.exe"
          Invoke-WebRequest -Uri $url -OutFile tesseract-installer.exe
          7z x tesseract-installer.exe -otesseract-portable -y
          if (-not (Test-Path "tesseract-portable/tessdata/eng.traineddata")) {
            $engUrl = "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata"
            Invoke-WebRequest -Uri $engUrl -OutFile "tesseract-portable/tessdata/eng.traineddata"
          }
          if (-not (Test-Path "tesseract-portable/tessdata/rus.traineddata")) {
            $rusUrl = "https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata"
            Invoke-WebRequest -Uri $rusUrl -OutFile "tesseract-portable/tessdata/rus.traineddata"
          }

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Inject version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/__version__ = \"0.0.0-dev\"/__version__ = \"${VERSION}\"/" app/backend/updater.py

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Build headless backend
        run: |
          cd app/backend
          pyinstaller dac_tracker.spec --noconfirm

      - name: Build Electron app & installer
        shell: pwsh
        run: |
          cd app
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec electron-builder --win --config electron-builder.json

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: app/release/*.exe
          generate_release_notes: true
