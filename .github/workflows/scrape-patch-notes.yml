name: Scrape DAC Patch Notes

on:
  schedule:
    # Every hour at :17 past
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-patch-notes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Scrape changelog
        run: node scripts/scrape-patch-notes.mjs

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- content/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "jackthb"
          git config user.email "19895932+jackthb@users.noreply.github.com"
          git add content/
          git commit -m "Auto-update DAC patch notes and game data from Steam changelog"
          git push
