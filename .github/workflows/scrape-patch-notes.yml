name: Scrape DAC Patch Notes

on:
  schedule:
    # Every hour at :17 past
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-patch-notes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Scrape changelog
        run: node scripts/scrape-patch-notes.mjs

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          version: 10

      - name: Install CMS dependencies
        if: steps.diff.outputs.changed == 'true'
        working-directory: cms
        run: pnpm install --frozen-lockfile

      - name: Sync new patch notes to Sanity
        if: steps.diff.outputs.changed == 'true'
        working-directory: cms
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: production
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: pnpm migrate -- --only=patchNotes

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update DAC patch notes and game data from Steam changelog"
          git push
