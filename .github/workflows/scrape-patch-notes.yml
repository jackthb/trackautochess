# Cronicle on the Pi (ops/cronicle/cronicle-job.dac-scrape-patch-notes.json)
# is now the primary hourly scrape, run from a residential IP that Steam's
# anti-bot checks don't flag. This workflow is an emergency/operator-triggered
# fallback only — keep the schedule disabled unless Cronicle is down.
name: Scrape DAC Patch Notes

on:
  workflow_dispatch:

concurrency:
  group: scrape-patch-notes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Scrape changelog
        id: scrape
        run: node scripts/scrape-patch-notes.mjs
        continue-on-error: true

      # The script has no dependencies for its normal fetch/reader-fallback
      # path, so most runs never reach this. It only runs when Steam blocked
      # both of those (see comments in scrape-patch-notes.mjs), and installs
      # Playwright just for that retry so headless Chromium can clear the
      # anti-bot challenge a plain fetch can't.
      - name: Install browser fallback
        if: steps.scrape.outcome == 'failure'
        run: |
          npm install --no-save --no-package-lock playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Retry scrape with browser fallback
        if: steps.scrape.outcome == 'failure'
        run: node scripts/scrape-patch-notes.mjs

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- content/patch-notes web/public/patch-banners)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "jackthb"
          git config user.email "19895932+jackthb@users.noreply.github.com"
          git add content/patch-notes web/public/patch-banners
          git commit -m "Auto-update DAC patch notes from Steam changelog"
          git push
