name: Cronicle Config Sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cronicle-cd.yml"
      - "ops/cronicle/cronicle-job.dac-poll-drodo-active.json"
      - "ops/cronicle/cronicle-job.dac-poll-drodo-all.json"
      - "ops/cronicle/scripts/poll-drodo*.sh"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check Cronicle CD secrets
        id: check
        env:
          CRONICLE_CONFIG_REPO: ${{ secrets.CRONICLE_CONFIG_REPO }}
          CRONICLE_CD_TOKEN: ${{ secrets.CRONICLE_CD_TOKEN }}
        run: |
          if [ -n "$CRONICLE_CONFIG_REPO" ] && [ -n "$CRONICLE_CD_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  sync-to-config-repo:
    needs: gate
    if: ${{ needs.gate.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: poll-drodo-active
            source_file: ops/cronicle/cronicle-job.dac-poll-drodo-active.json
            target_file: dac-tools-poll-drodo-active.json
          - name: poll-drodo-all
            source_file: ops/cronicle/cronicle-job.dac-poll-drodo-all.json
            target_file: dac-tools-poll-drodo-all.json
    steps:
      - name: Checkout dac-tools
        uses: actions/checkout@v4

      - name: Checkout Cronicle config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CRONICLE_CONFIG_REPO }}
          token: ${{ secrets.CRONICLE_CD_TOKEN }}
          path: cronicle-config
          fetch-depth: 1

      - name: Update central Cronicle config repo (${{ matrix.name }})
        env:
          CRONICLE_CD_BRANCH: ${{ secrets.CRONICLE_CD_BRANCH || 'main' }}
        run: |
          set -euo pipefail

          cp "${{ matrix.source_file }}" "cronicle-config/jobs/${{ matrix.target_file }}"
          cd cronicle-config

          if git diff --quiet jobs/${{ matrix.target_file }}; then
            echo "No config changes to push for ${{ matrix.name }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "jobs/${{ matrix.target_file }}"
          git commit -m "chore(cronicle): sync ${{ matrix.name }} job"
          git push origin "HEAD:${CRONICLE_CD_BRANCH}"

  sync-skipped:
    needs: gate
    if: ${{ needs.gate.outputs.configured == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Manual fallback required
        run: |
          echo "Cronicle Config Sync is disabled because secrets are not configured in this repo."
          echo "Current workflow only updates central cronicle-cd repo when both CRONICLE_CONFIG_REPO and CRONICLE_CD_TOKEN are set."
          echo "For now, update /home/jack/cronicle-cd/jobs/dac-tools-poll-drodo-*.json manually and run its sync workflow or manual-sync script there."
