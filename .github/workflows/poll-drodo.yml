name: Poll Drodo (MMR snapshots)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-drodo
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/poll-drodo
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set in this repo" >&2
            exit 1
          fi
          status=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "https://www.trackautochess.com/api/cron/poll-drodo" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $status"
          cat /tmp/resp.json
          if [ "$status" != "200" ]; then
            exit 1
          fi
