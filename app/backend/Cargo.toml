[package]
name = "dac-capture-backend"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
