<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DAC Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }

    .widget {
      background: rgba(14, 16, 20, 0.92);
      border: 1px solid #1e2230;
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      -webkit-app-region: no-drag;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      position: relative;
    }

    .btn-record {
      background: #2a2e3e;
      border: 2px solid #555;
    }

    .btn-record .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #888;
      transition: all 0.2s;
    }

    .btn-record.recording {
      border-color: #e53935;
    }

    .btn-record.recording .dot {
      background: #e53935;
      border-radius: 3px;
      width: 10px;
      height: 10px;
      animation: pulse-rec 1.5s infinite;
    }

    .btn-record:hover {
      border-color: #e53935;
    }

    .btn-record:hover .dot {
      background: #e53935;
    }

    .btn-capture {
      background: #E0402A;
    }

    .btn-capture svg {
      width: 14px;
      height: 14px;
      fill: white;
    }

    .btn-capture:hover {
      background: #FF6046;
    }

    .btn-capture.capturing {
      background: #4eaa62;
      animation: flash 0.6s ease-out;
    }

    @keyframes flash {
      0% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .label {
      font-size: 11px;
      color: #6b7080;
      letter-spacing: 0.5px;
      min-width: 32px;
    }

    .label.recording {
      color: #e53935;
    }

    @keyframes pulse-rec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="widget">
    <button class="btn btn-record" id="btn-record" title="Record (F7)">
      <div class="dot"></div>
    </button>
    <span class="label" id="label">REC</span>
    <button class="btn btn-capture" id="btn-capture" title="Capture (F6)">
      <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
    </button>
  </div>

  <script>
    const btnRecord = document.getElementById("btn-record");
    const label = document.getElementById("label");
    let recording = false;

    btnRecord.addEventListener("click", () => {
      window.widget.toggleRecording();
    });

    const btnCapture = document.getElementById("btn-capture");
    btnCapture.addEventListener("click", () => {
      window.widget.capture();
      btnCapture.classList.add("capturing");
      setTimeout(() => btnCapture.classList.remove("capturing"), 600);
    });

    window.widget.onStatus((status) => {
      recording = status.recording;
      if (recording) {
        btnRecord.classList.add("recording");
        label.classList.add("recording");
        label.textContent = "REC";
      } else {
        btnRecord.classList.remove("recording");
        label.classList.remove("recording");
        label.textContent = "REC";
      }
    });
  </script>
</body>
</html>
