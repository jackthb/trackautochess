<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>DAC Calibration</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #060608;
  --panel: #0b0b0f;
  --panel-alt: #0e0e14;
  --border: #1a1a24;
  --border-bright: #2a2a3a;
  --text: #b8b8c8;
  --text-dim: #555568;
  --text-bright: #e8e8f0;
  --green: #4ade80;
  --green-dim: #166534;
  --orange: #f97316;
  --orange-dim: #7c2d12;
  --blue: #38bdf8;
  --red: #f87171;
  --purple: #a78bfa;
  --pink: #f472b6;
  --yellow: #facc15;
  --cyan: #22d3ee;
  --font: 'JetBrains Mono', 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 11px; overflow: hidden; height: 100vh; user-select: none; }

/* ── Toolbar ─────────────────────────────────── */
#toolbar {
  position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 50;
  background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 0 12px;
  font-size: 10px;
}
.tb-group { display: flex; align-items: center; gap: 4px; }
.tb-label { color: var(--text-dim); font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; }
.tb-val { color: var(--green); font-weight: 500; min-width: 70px; }
.tb-val.rgb { color: var(--orange); }
.tb-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
.tb-btn {
  background: var(--panel-alt); color: var(--text-dim); border: 1px solid var(--border);
  padding: 2px 8px; cursor: pointer; font-family: var(--font); font-size: 10px;
  border-radius: 2px; transition: all 0.1s; line-height: 1.4;
}
.tb-btn:hover { background: var(--border); color: var(--text-bright); border-color: var(--border-bright); }
.tb-spacer { flex: 1; }
#toolbar .mode-tag {
  font-size: 9px; padding: 2px 6px; border-radius: 2px;
  background: var(--green-dim); color: var(--green); font-weight: 600;
  letter-spacing: 0.5px; text-transform: uppercase;
}
#toolbar .mode-tag.assigning { background: rgba(56,189,248,0.15); color: var(--blue); }

/* ── Left Panel ──────────────────────────────── */
#left-panel {
  position: fixed; top: 32px; left: 0; width: 200px; bottom: 0;
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 10;
}
.lp-section { padding: 8px 10px 4px; }
.lp-heading {
  font-size: 9px; font-weight: 600; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px;
}

.ar-toggle { display: flex; gap: 2px; margin-bottom: 8px; }
.ar-toggle button {
  flex: 1; background: var(--panel-alt); color: var(--text-dim); border: 1px solid var(--border);
  padding: 4px 0; cursor: pointer; font-family: var(--font); font-size: 10px;
  transition: all 0.1s; border-radius: 2px;
}
.ar-toggle button.active { background: var(--green-dim); color: var(--green); border-color: #1a5c32; }
.ar-toggle button:hover:not(.active) { background: var(--border); color: var(--text); }

.screen-list { flex: 1; overflow-y: auto; }
.screen-item {
  padding: 6px 10px; cursor: pointer; font-size: 10px;
  border-left: 2px solid transparent; transition: all 0.1s;
  display: flex; align-items: center; gap: 6px; color: var(--text-dim);
}
.screen-item:hover { background: rgba(255,255,255,0.02); color: var(--text); }
.screen-item.active { background: rgba(74,222,128,0.04); border-left-color: var(--green); color: var(--green); }
.screen-item .dot {
  width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
}
.dot-empty { background: var(--border); }
.dot-partial { background: var(--orange); }
.dot-complete { background: var(--green); }

.screenshot-list { border-top: 1px solid var(--border); overflow-y: auto; max-height: 200px; }
.ss-item {
  padding: 5px 10px; cursor: pointer; font-size: 10px; color: var(--text-dim);
  transition: all 0.1s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ss-item:hover { background: rgba(255,255,255,0.02); color: var(--text); }
.ss-item.active { color: var(--green); background: rgba(74,222,128,0.04); }

/* ── Viewport ────────────────────────────────── */
#viewport {
  position: fixed; top: 32px; left: 200px; right: 280px; bottom: 32px;
  overflow: hidden; cursor: crosshair; background: var(--bg);
}
#viewport.empty { display: flex; align-items: center; justify-content: center; cursor: default; }
#viewport.empty::after {
  content: 'Load a screenshot or drop an image here';
  color: var(--border-bright); font-size: 12px; font-weight: 300;
}
#imgCanvas, #overlayCanvas {
  position: absolute; top: 0; left: 0; image-rendering: pixelated;
}
#overlayCanvas { pointer-events: none; }

/* ── Loupe ───────────────────────────────────── */
#loupe {
  position: fixed; width: 120px; height: 120px; border: 1px solid var(--border-bright);
  background: #000; pointer-events: none; z-index: 30; display: none;
  image-rendering: pixelated; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
}
#loupe canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.loupe-cross-h, .loupe-cross-v { position: absolute; background: rgba(74,222,128,0.25); pointer-events: none; }
.loupe-cross-h { left: 0; right: 0; top: 50%; height: 1px; }
.loupe-cross-v { top: 0; bottom: 0; left: 50%; width: 1px; }

/* ── Right Panel ─────────────────────────────── */
#right-panel {
  position: fixed; top: 32px; right: 0; width: 280px; bottom: 32px;
  background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 10;
}
#rp-header {
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
#rp-title { font-size: 10px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
#rp-count { font-size: 10px; color: var(--text-dim); }

#regions-list { flex: 1; overflow-y: auto; padding: 2px 0; }
#regions-list::-webkit-scrollbar { width: 3px; }
#regions-list::-webkit-scrollbar-thumb { background: var(--border); }

.reg-item {
  padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.02);
  cursor: pointer; transition: background 0.1s;
}
.reg-item:hover { background: rgba(255,255,255,0.02); }
.reg-item.assigning { background: rgba(56,189,248,0.06); border-left: 2px solid var(--blue); }
.reg-item .reg-top { display: flex; align-items: center; gap: 6px; }
.reg-item .reg-swatch {
  width: 8px; height: 8px; border-radius: 1px; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.1);
}
.reg-item .reg-name { font-size: 10px; color: var(--text); flex: 1; }
.reg-item .reg-name.empty { color: var(--text-dim); font-style: italic; }
.reg-item .reg-desc { font-size: 9px; color: var(--text-dim); margin-top: 2px; margin-left: 14px; }
.reg-item .reg-coords { font-size: 9px; color: var(--text-dim); margin-top: 2px; margin-left: 14px; }
.reg-item .reg-coords span { color: var(--green); }
.reg-item .reg-actions { display: flex; gap: 4px; margin-left: auto; }
.reg-item .reg-clear {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 10px; padding: 0 2px; font-family: var(--font);
}
.reg-item .reg-clear:hover { color: var(--red); }

/* ── Bottom Bar ──────────────────────────────── */
#bottombar {
  position: fixed; bottom: 0; left: 200px; right: 0; height: 32px;
  background: var(--panel); border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px; padding: 0 10px; z-index: 10;
}
.bb-btn {
  background: var(--panel-alt); color: var(--text-dim); border: 1px solid var(--border);
  padding: 3px 10px; cursor: pointer; font-family: var(--font); font-size: 10px;
  border-radius: 2px; transition: all 0.1s;
}
.bb-btn:hover { background: var(--border); color: var(--text-bright); border-color: var(--border-bright); }
.bb-btn.primary { background: var(--green-dim); color: var(--green); border-color: #1a5c32; }
.bb-btn.primary:hover { background: #1a5c32; }
.bb-btn.danger { color: var(--red); border-color: var(--orange-dim); }
.bb-btn.danger:hover { background: rgba(248,113,113,0.08); }
.bb-btn:disabled { opacity: 0.3; cursor: default; }
.bb-spacer { flex: 1; }
#bb-status { font-size: 9px; color: var(--text-dim); }

/* ── Debug Panel ─────────────────────────────── */
#debug-panel {
  position: fixed; top: 32px; right: 0; width: 480px; bottom: 32px;
  background: var(--panel); border-left: 1px solid var(--border);
  z-index: 40; transform: translateX(100%); transition: transform 0.2s ease;
  display: flex; flex-direction: column; overflow: hidden;
}
#debug-panel.open { transform: translateX(0); }
#debug-header {
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
#debug-header h3 { font-size: 11px; color: var(--orange); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
#debug-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; font-family: var(--font); }
#debug-close:hover { color: var(--red); }
#debug-content {
  flex: 1; overflow-y: auto; padding: 10px 12px; font-size: 10px; line-height: 1.6;
}
#debug-content .d-section { margin-bottom: 12px; padding: 8px; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 3px; }
#debug-content .d-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
#debug-content .d-value { color: var(--green); }
#debug-content .d-error { color: var(--red); }
#debug-content .d-row { margin: 4px 0; }
#debug-content pre { background: var(--bg); padding: 8px; border-radius: 3px; font-size: 10px; overflow-x: auto; color: var(--text-dim); }

/* ── Toast ───────────────────────────────────── */
#toast {
  position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
  background: var(--green-dim); color: var(--green); padding: 6px 16px;
  border-radius: 3px; font-size: 10px; font-family: var(--font);
  opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 100;
  border: 1px solid #1a5c32;
}
#toast.show { opacity: 1; }

input[type="file"] { display: none; }
</style>
</head>
<body>

<div id="toolbar">
  <div class="tb-group">
    <span class="tb-label">px</span>
    <span class="tb-val" id="tb-px">--</span>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <span class="tb-label">frac</span>
    <span class="tb-val" id="tb-frac">--</span>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <span class="tb-label">rgb</span>
    <span class="tb-val rgb" id="tb-rgb">--</span>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <span class="tb-label">zoom</span>
    <span class="tb-val" id="tb-zoom">1.0x</span>
  </div>
  <button class="tb-btn" onclick="zoomIn()">+</button>
  <button class="tb-btn" onclick="zoomOut()">&minus;</button>
  <button class="tb-btn" onclick="zoomFit()">Fit</button>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <span class="tb-label">img</span>
    <span class="tb-val" id="tb-size">--</span>
  </div>
  <span class="tb-spacer"></span>
  <span class="mode-tag" id="mode-tag" style="display:none"></span>
</div>

<div id="left-panel">
  <div class="lp-section">
    <div class="lp-heading">Aspect Ratio</div>
    <div class="ar-toggle" id="ar-toggle"></div>
  </div>
  <div class="lp-section">
    <div class="lp-heading">Screen Type</div>
  </div>
  <div class="screen-list" id="screen-list"></div>
  <div class="lp-section">
    <div class="lp-heading">Screenshots</div>
  </div>
  <div class="screenshot-list" id="screenshot-list"></div>
</div>

<div id="viewport" class="empty">
  <canvas id="imgCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>
</div>

<div id="loupe">
  <canvas id="loupeCanvas" width="120" height="120"></canvas>
  <div class="loupe-cross-h"></div>
  <div class="loupe-cross-v"></div>
</div>

<div id="right-panel">
  <div id="rp-header">
    <span id="rp-title">Regions</span>
    <span id="rp-count"></span>
  </div>
  <div id="regions-list"></div>
</div>

<div id="bottombar">
  <button class="bb-btn" onclick="loadFileDialog()">Load Image</button>
  <button class="bb-btn" onclick="loadConfig()">Load Config</button>
  <button class="bb-btn primary" onclick="saveConfig()">Save Config</button>
  <button class="bb-btn danger" onclick="clearRegions()">Clear</button>
  <span class="bb-spacer"></span>
  <button class="bb-btn" id="btn-debug" onclick="runDebug()" disabled>Run Debug</button>
  <button class="bb-btn" id="btn-sentinel" onclick="runSentinelTest()" disabled>Test Sentinel</button>
  <span id="bb-status"></span>
</div>

<div id="debug-panel">
  <div id="debug-header">
    <h3>Debug Output</h3>
    <button id="debug-close" onclick="closeDebug()">&times;</button>
  </div>
  <div id="debug-content"></div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*">

<script>
// ── Screen type & region definitions ────────────────────────────────────────

const SCREEN_TYPES = {
  game_over: {
    description: "GAME OVER results table",
    regions: {
      title_region: { description: "GAME OVER title text", type: "rect" },
      col_player: { description: "Player name + rank column", type: "xrange" },
      col_level: { description: "Level number column", type: "xrange" },
      col_synergy: { description: "Synergy badge icons", type: "xrange" },
      col_relic: { description: "Relic icons", type: "xrange" },
      col_wl: { description: "Win-Loss column", type: "xrange" },
      table_area: { description: "Full 8-player table bounds", type: "rect" },
    }
  },
  my_matches: {
    description: "MY MATCHES history screen",
    regions: {
      tab_region: { description: "Tab bar with MY MATCHES text", type: "rect" },
      table_area: { description: "Full table area", type: "rect" },
      sep_scan_band: { description: "X-band for dark row separators", type: "xrange" },
      col_placement: { description: "Placement number", type: "xrange" },
      col_level: { description: "Level number", type: "xrange" },
      col_units: { description: "Unit icons grid", type: "xrange" },
      col_synergy: { description: "Synergy icons", type: "xrange" },
      col_relic: { description: "Relic icons", type: "xrange" },
      col_wl: { description: "Win-Loss text", type: "xrange" },
      col_rank: { description: "Rank change arrows", type: "xrange" },
      col_time: { description: "Time ago text", type: "xrange" },
    }
  },
  sentinel_final_ranking: {
    description: "Sentinel: Final Ranking",
    regions: {
      search_region: { description: "Template match search area", type: "rect" },
    }
  },
  sentinel_round_start: {
    description: "Sentinel: Round Start",
    regions: {
      search_region: { description: "Template match search area", type: "rect" },
    }
  }
};

const DEFAULT_CALIBRATION = {
  "21:9": {
    reference_resolution: "3440x1440",
    game_over: {
      title_region: [0.30, 0.00, 0.70, 0.12],
      col_player: [0.025, 0.155],
      col_level: [0.130, 0.165],
      col_synergy: [0.390, 0.500],
      col_relic: [0.485, 0.555],
      col_wl: [0.573, 0.612],
      table_area: [0.0, 0.155, 1.0, 0.97],
    },
    my_matches: {
      tab_region: [0.30, 0.12, 0.55, 0.20],
      table_area: [0.0, 0.33, 1.0, 0.90],
      sep_scan_band: [0.60, 0.70],
      col_placement: [0.390, 0.436],
      col_level: [0.452, 0.481],
      col_units: [0.4814, 0.5945],
      col_synergy: [0.597, 0.692],
      col_relic: [0.7035, 0.7491],
      col_wl: [0.752, 0.792],
      col_rank: [0.792, 0.863],
      col_time: [0.390, 0.436],
    },
    sentinel_final_ranking: { search_region: [0.0, 0.20, 0.15, 0.35] },
    sentinel_round_start: { search_region: [0.80, 0.15, 0.95, 0.35] },
  },
  "16:9": {
    reference_resolution: "1920x1080",
    game_over: {},
    my_matches: {},
    sentinel_final_ranking: {},
    sentinel_round_start: {},
  }
};

const REGION_COLORS = [
  '#f97316', '#38bdf8', '#a78bfa', '#f472b6', '#facc15',
  '#4ade80', '#fb923c', '#818cf8', '#e879f9', '#34d399',
  '#22d3ee', '#fbbf24'
];

// ── State ───────────────────────────────────────────────────────────────────

let config = JSON.parse(JSON.stringify(DEFAULT_CALIBRATION));
let currentAR = '21:9';
let currentScreen = 'game_over';
let assigningRegion = null;
let screenshotFiles = [];
let currentScreenshotPath = null;

let img = null;
let imgW = 0, imgH = 0;
let zoom = 1, panX = 0, panY = 0;

let dragging = false, dragStartX = 0, dragStartY = 0, dragCurX = 0, dragCurY = 0;
let isPanning = false, panStartMX = 0, panStartMY = 0, panStartPX = 0, panStartPY = 0;
let mouseImgX = -1, mouseImgY = -1;

const viewport = document.getElementById('viewport');
const imgCanvas = document.getElementById('imgCanvas');
const imgCtx = imgCanvas.getContext('2d', { willReadFrequently: true });
const overlayCanvas = document.getElementById('overlayCanvas');
const overlayCtx = overlayCanvas.getContext('2d');
const loupeEl = document.getElementById('loupe');
const loupeCanvas = document.getElementById('loupeCanvas');
const loupeCtx = loupeCanvas.getContext('2d');

// ── Config helpers ──────────────────────────────────────────────────────────

function getARData() { return config[currentAR] || {}; }
function getScreenRegions() { return getARData()[currentScreen] || {}; }
function setScreenRegions(regions) {
  if (!config[currentAR]) config[currentAR] = {};
  config[currentAR][currentScreen] = regions;
  autoSave();
}
function getExpected() { return SCREEN_TYPES[currentScreen]?.regions || {}; }

function getScreenshots() {
  return config[currentAR]?._screenshots || {};
}
function setScreenshotForScreen(name) {
  if (!config[currentAR]) config[currentAR] = {};
  if (!config[currentAR]._screenshots) config[currentAR]._screenshots = {};
  config[currentAR]._screenshots[currentScreen] = name;
}

// ── Aspect ratio toggle ─────────────────────────────────────────────────────

function buildARToggle() {
  const el = document.getElementById('ar-toggle');
  el.innerHTML = '';
  for (const ar of Object.keys(config)) {
    const btn = document.createElement('button');
    btn.textContent = ar;
    btn.className = ar === currentAR ? 'active' : '';
    btn.onclick = () => { currentAR = ar; buildARToggle(); buildScreenList(); buildRegionPanel(); drawOverlay(); fetchScreenshots().then(loadSavedScreenshot); };
    el.appendChild(btn);
  }
}

// ── Screen list ─────────────────────────────────────────────────────────────

function buildScreenList() {
  const el = document.getElementById('screen-list');
  el.innerHTML = '';
  for (const [key, info] of Object.entries(SCREEN_TYPES)) {
    const item = document.createElement('div');
    item.className = 'screen-item' + (key === currentScreen ? ' active' : '');
    const expected = Object.keys(info.regions);
    const calibrated = getARData()[key] || {};
    const count = expected.filter(k => calibrated[k]).length;
    let dotClass = 'dot-empty';
    if (count > 0 && count >= expected.length) dotClass = 'dot-complete';
    else if (count > 0) dotClass = 'dot-partial';
    item.innerHTML = `<div class="dot ${dotClass}"></div><span>${info.description}</span>`;
    item.onclick = () => { currentScreen = key; assigningRegion = null; buildScreenList(); buildRegionPanel(); drawOverlay(); loadSavedScreenshot(); };
    el.appendChild(item);
  }
}

// ── Screenshot list ─────────────────────────────────────────────────────────

async function fetchScreenshots() {
  try {
    screenshotGroups = await window.calibration.listScreenshots(currentAR);
    screenshotFiles = screenshotGroups.flatMap(g => g.files);
  } catch { screenshotGroups = []; screenshotFiles = []; }
  buildScreenshotList();
}

let screenshotGroups = [];

function buildScreenshotList() {
  const el = document.getElementById('screenshot-list');
  el.innerHTML = '';
  for (const group of screenshotGroups) {
    const heading = document.createElement('div');
    heading.style.cssText = 'padding:4px 10px;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px;border-top:1px solid var(--border);margin-top:2px;';
    heading.textContent = group.label;
    el.appendChild(heading);
    for (const f of group.files) {
      const item = document.createElement('div');
      item.className = 'ss-item' + (currentScreenshotPath === f.path ? ' active' : '');
      item.textContent = f.name;
      item.title = f.path;
      item.onclick = async () => {
        currentScreenshotPath = f.path;
        setScreenshotForScreen(f.name);
        autoSave();
        const dataUrl = await window.calibration.getScreenshot(f.path);
        if (dataUrl) loadImage(dataUrl);
        buildScreenshotList();
        document.getElementById('btn-debug').disabled = false;
        updateSentinelBtn();
      };
      el.appendChild(item);
    }
  }
}

function autoSave() {
  window.calibration.saveConfig(config).catch(() => {});
}

// ── Image loading ───────────────────────────────────────────────────────────

function loadImage(src) {
  const i = new Image();
  i.onload = () => {
    img = i; imgW = i.width; imgH = i.height;
    imgCanvas.width = imgW; imgCanvas.height = imgH;
    imgCtx.drawImage(i, 0, 0);
    viewport.classList.remove('empty');
    document.getElementById('tb-size').textContent = `${imgW}\u00d7${imgH}`;
    zoomFit();
  };
  i.onerror = () => toast('Failed to load image');
  i.src = src;
}

function loadFileDialog() {
  const input = document.getElementById('fileInput');
  input.onchange = e => {
    if (e.target.files[0]) {
      const r = new FileReader();
      r.onload = ev => {
        currentScreenshotPath = null;
        buildScreenshotList();
        loadImage(ev.target.result);
        document.getElementById('btn-debug').disabled = true;
      };
      r.readAsDataURL(e.target.files[0]);
    }
  };
  input.click();
}

viewport.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
viewport.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) {
    const r = new FileReader();
    r.onload = ev => { currentScreenshotPath = null; loadImage(ev.target.result); };
    r.readAsDataURL(e.dataTransfer.files[0]);
  }
});

// ── Zoom & pan ──────────────────────────────────────────────────────────────

function fitZoom() {
  if (!img) return 1;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  return Math.min(vw / imgW, vh / imgH, 4);
}

function zoomFit() {
  zoom = fitZoom();
  panX = (viewport.clientWidth - imgW * zoom) / 2;
  panY = (viewport.clientHeight - imgH * zoom) / 2;
  applyTransform();
}

function zoomIn() { zoomAt(zoom * 1.4, viewport.clientWidth / 2, viewport.clientHeight / 2); }
function zoomOut() { zoomAt(zoom / 1.4, viewport.clientWidth / 2, viewport.clientHeight / 2); }

function zoomAt(newZoom, cx, cy) {
  const imgX = (cx - panX) / zoom, imgY = (cy - panY) / zoom;
  zoom = Math.max(0.05, Math.min(newZoom, 30));
  panX = cx - imgX * zoom;
  panY = cy - imgY * zoom;
  applyTransform();
}

function applyTransform() {
  imgCanvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  imgCanvas.style.transformOrigin = '0 0';
  resizeOverlay();
  drawOverlay();
  document.getElementById('tb-zoom').textContent = (zoom < 1 ? zoom.toFixed(2) : zoom.toFixed(1)) + 'x';
}

function resizeOverlay() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  if (overlayCanvas.width !== vw || overlayCanvas.height !== vh) {
    overlayCanvas.width = vw;
    overlayCanvas.height = vh;
  }
}

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  if (!img) return;
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const rect = viewport.getBoundingClientRect();
  zoomAt(zoom * factor, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

// ── Mouse ───────────────────────────────────────────────────────────────────

function mouseToImg(e) {
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const ix = (mx - panX) / zoom, iy = (my - panY) / zoom;
  return { mx, my, ix, iy };
}

function updateInfo(pos) {
  const ix = Math.round(pos.ix), iy = Math.round(pos.iy);
  mouseImgX = pos.ix; mouseImgY = pos.iy;
  if (!img || ix < 0 || iy < 0 || ix >= imgW || iy >= imgH) {
    document.getElementById('tb-px').textContent = '--';
    document.getElementById('tb-frac').textContent = '--';
    document.getElementById('tb-rgb').textContent = '--';
    return;
  }
  document.getElementById('tb-px').textContent = `${ix}, ${iy}`;
  document.getElementById('tb-frac').textContent = `${(ix / imgW).toFixed(4)}, ${(iy / imgH).toFixed(4)}`;
  const d = imgCtx.getImageData(ix, iy, 1, 1).data;
  const rgbEl = document.getElementById('tb-rgb');
  rgbEl.textContent = `${d[0]}, ${d[1]}, ${d[2]}`;
  rgbEl.style.color = `rgb(${Math.max(d[0],60)},${Math.max(d[1],60)},${Math.max(d[2],60)})`;
}

function updateLoupe(e, pos) {
  if (!img) { loupeEl.style.display = 'none'; return; }
  loupeEl.style.display = 'block';
  loupeEl.style.left = (e.clientX + 16) + 'px';
  loupeEl.style.top = (e.clientY - 136) + 'px';
  const loupeZoom = 8;
  const sw = 120 / loupeZoom, sh = 120 / loupeZoom;
  loupeCtx.imageSmoothingEnabled = false;
  loupeCtx.clearRect(0, 0, 120, 120);
  loupeCtx.drawImage(imgCanvas, pos.ix - sw / 2, pos.iy - sh / 2, sw, sh, 0, 0, 120, 120);
}

viewport.addEventListener('mousedown', e => {
  if (!img) return;
  if (e.button === 1 || (e.button === 0 && e.altKey)) {
    isPanning = true;
    panStartMX = e.clientX; panStartMY = e.clientY;
    panStartPX = panX; panStartPY = panY;
    viewport.style.cursor = 'grabbing';
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;
  const pos = mouseToImg(e);
  dragging = true;
  dragStartX = pos.ix; dragStartY = pos.iy;
  dragCurX = pos.ix; dragCurY = pos.iy;
});

viewport.addEventListener('mousemove', e => {
  if (isPanning) {
    panX = panStartPX + (e.clientX - panStartMX);
    panY = panStartPY + (e.clientY - panStartMY);
    applyTransform();
    return;
  }
  const pos = mouseToImg(e);
  updateInfo(pos);
  updateLoupe(e, pos);
  if (dragging) {
    dragCurX = pos.ix; dragCurY = pos.iy;
    drawOverlay();
  }
});

viewport.addEventListener('mouseup', e => {
  if (isPanning) {
    isPanning = false;
    viewport.style.cursor = 'crosshair';
    return;
  }
  if (!dragging) return;
  dragging = false;
  const pos = mouseToImg(e);
  let x0 = Math.min(dragStartX, pos.ix), y0 = Math.min(dragStartY, pos.iy);
  let x1 = Math.max(dragStartX, pos.ix), y1 = Math.max(dragStartY, pos.iy);
  x0 = Math.max(0, x0); y0 = Math.max(0, y0);
  x1 = Math.min(imgW, x1); y1 = Math.min(imgH, y1);

  if (x1 - x0 < 3 || y1 - y0 < 3) { drawOverlay(); return; }

  const fx0 = +(x0 / imgW).toFixed(5), fy0 = +(y0 / imgH).toFixed(5);
  const fx1 = +(x1 / imgW).toFixed(5), fy1 = +(y1 / imgH).toFixed(5);

  if (assigningRegion) {
    const regions = { ...getScreenRegions() };
    const expected = getExpected();
    const rtype = expected[assigningRegion]?.type;
    if (rtype === 'xrange') {
      regions[assigningRegion] = [fx0, fx1];
    } else {
      regions[assigningRegion] = [fx0, fy0, fx1, fy1];
    }
    setScreenRegions(regions);
    assigningRegion = null;
    updateModeTag();
    buildRegionPanel();
    buildScreenList();
    drawOverlay();
  } else {
    const name = prompt('Region name:');
    if (!name) { drawOverlay(); return; }
    const regions = { ...getScreenRegions() };
    regions[name] = [fx0, fy0, fx1, fy1];
    setScreenRegions(regions);
    buildRegionPanel();
    buildScreenList();
    drawOverlay();
  }
});

viewport.addEventListener('mouseleave', () => { loupeEl.style.display = 'none'; });

// ── Draw overlay (canvas-based, fast) ───────────────────────────────────────

function drawOverlay() {
  if (!img) return;
  const ctx = overlayCtx;
  const vw = overlayCanvas.width, vh = overlayCanvas.height;
  ctx.clearRect(0, 0, vw, vh);

  const regions = getScreenRegions();
  const expected = getExpected();
  const allNames = Object.keys(expected);

  let idx = 0;
  for (const [name, coords] of Object.entries(regions)) {
    if (!Array.isArray(coords) || coords.length < 2) { idx++; continue; }
    const color = REGION_COLORS[idx % REGION_COLORS.length];
    const isAssigning = assigningRegion === name;

    let sx0, sy0, sx1, sy1;
    if (coords.length >= 4) {
      sx0 = panX + coords[0] * imgW * zoom;
      sy0 = panY + coords[1] * imgH * zoom;
      sx1 = panX + coords[2] * imgW * zoom;
      sy1 = panY + coords[3] * imgH * zoom;
    } else {
      sx0 = panX + coords[0] * imgW * zoom;
      sy0 = panY;
      sx1 = panX + coords[1] * imgW * zoom;
      sy1 = panY + imgH * zoom;
    }

    const w = sx1 - sx0, h = sy1 - sy0;
    if (sx1 < 0 || sy1 < 0 || sx0 > vw || sy0 > vh) { idx++; continue; }

    ctx.save();
    ctx.strokeStyle = isAssigning ? '#38bdf8' : color;
    ctx.lineWidth = isAssigning ? 2 : 1.5;
    ctx.setLineDash(isAssigning ? [4, 4] : []);
    ctx.strokeRect(sx0, sy0, w, h);

    ctx.fillStyle = isAssigning ? 'rgba(56,189,248,0.06)' : hexToRGBA(color, 0.04);
    ctx.fillRect(sx0, sy0, w, h);

    ctx.font = '600 10px "JetBrains Mono"';
    const label = name;
    const tw = ctx.measureText(label).width;
    const lx = sx0, ly = sy0 - 4;

    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(lx - 1, ly - 11, tw + 6, 13);
    ctx.fillStyle = isAssigning ? '#38bdf8' : color;
    ctx.fillText(label, lx + 2, ly);

    ctx.restore();
    idx++;
  }

  if (dragging) {
    const sx0 = panX + Math.min(dragStartX, dragCurX) * zoom;
    const sy0 = panY + Math.min(dragStartY, dragCurY) * zoom;
    const sx1 = panX + Math.max(dragStartX, dragCurX) * zoom;
    const sy1 = panY + Math.max(dragStartY, dragCurY) * zoom;

    ctx.save();
    ctx.strokeStyle = assigningRegion ? '#38bdf8' : '#4ade80';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.strokeRect(sx0, sy0, sx1 - sx0, sy1 - sy0);
    ctx.fillStyle = assigningRegion ? 'rgba(56,189,248,0.08)' : 'rgba(74,222,128,0.08)';
    ctx.fillRect(sx0, sy0, sx1 - sx0, sy1 - sy0);
    ctx.restore();
  }
}

function hexToRGBA(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Region panel ────────────────────────────────────────────────────────────

function buildRegionPanel() {
  const list = document.getElementById('regions-list');
  list.innerHTML = '';
  const expected = getExpected();
  const calibrated = getScreenRegions();
  const names = Object.keys(expected);
  const count = names.filter(k => calibrated[k]).length;

  document.getElementById('rp-title').textContent = SCREEN_TYPES[currentScreen]?.description || currentScreen;
  document.getElementById('rp-count').textContent = `${count}/${names.length}`;

  for (let i = 0; i < names.length; i++) {
    const name = names[i];
    const info = expected[name];
    const coords = calibrated[name];
    const has = Array.isArray(coords) && coords.length >= 2;
    const color = REGION_COLORS[i % REGION_COLORS.length];
    const isAssign = assigningRegion === name;

    const item = document.createElement('div');
    item.className = 'reg-item' + (isAssign ? ' assigning' : '');

    let coordStr = '';
    if (has) {
      if (coords.length >= 4) {
        coordStr = `<span>${coords[0].toFixed(4)}, ${coords[1].toFixed(4)}</span> &rarr; <span>${coords[2].toFixed(4)}, ${coords[3].toFixed(4)}</span>`;
      } else {
        coordStr = `x: <span>${coords[0].toFixed(4)}</span> &rarr; <span>${coords[1].toFixed(4)}</span>`;
      }
    }

    item.innerHTML = `
      <div class="reg-top">
        <div class="reg-swatch" style="background:${has ? color : 'var(--border)'}"></div>
        <span class="reg-name ${has ? '' : 'empty'}">${name}</span>
        <div class="reg-actions">
          ${has ? `<button class="reg-clear" data-name="${name}">&times;</button>` : ''}
        </div>
      </div>
      <div class="reg-desc">${info.description} (${info.type})</div>
      ${has ? `<div class="reg-coords">${coordStr}</div>` : ''}
    `;

    item.addEventListener('click', e => {
      if (e.target.closest('.reg-clear')) {
        const r = { ...getScreenRegions() };
        delete r[name];
        setScreenRegions(r);
        assigningRegion = null;
        updateModeTag();
        buildRegionPanel();
        buildScreenList();
        drawOverlay();
        return;
      }
      assigningRegion = assigningRegion === name ? null : name;
      updateModeTag();
      buildRegionPanel();
      drawOverlay();
    });

    list.appendChild(item);
  }

  const customNames = Object.keys(calibrated).filter(k => !names.includes(k));
  if (customNames.length > 0) {
    const div = document.createElement('div');
    div.style.cssText = 'padding:6px 10px;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;border-top:1px solid var(--border);margin-top:4px;';
    div.textContent = 'Custom';
    list.appendChild(div);

    customNames.forEach((name, ci) => {
      const coords = calibrated[name];
      if (!Array.isArray(coords)) return;
      const color = REGION_COLORS[(names.length + ci) % REGION_COLORS.length];
      const item = document.createElement('div');
      item.className = 'reg-item';
      item.innerHTML = `
        <div class="reg-top">
          <div class="reg-swatch" style="background:${color}"></div>
          <span class="reg-name">${name}</span>
          <button class="reg-clear" data-name="${name}">&times;</button>
        </div>
        <div class="reg-coords">${coords.map(v => v.toFixed(4)).join(', ')}</div>
      `;
      item.querySelector('.reg-clear').addEventListener('click', () => {
        const r = { ...getScreenRegions() };
        delete r[name];
        setScreenRegions(r);
        buildRegionPanel();
        buildScreenList();
        drawOverlay();
      });
      list.appendChild(item);
    });
  }
}

function updateModeTag() {
  const tag = document.getElementById('mode-tag');
  if (assigningRegion) {
    tag.style.display = '';
    tag.className = 'mode-tag assigning';
    tag.textContent = `assign: ${assigningRegion}`;
  } else {
    tag.style.display = 'none';
  }
}

function updateSentinelBtn() {
  const btn = document.getElementById('btn-sentinel');
  btn.disabled = !currentScreenshotPath || !currentScreen.startsWith('sentinel_');
}

// ── Config save/load ────────────────────────────────────────────────────────

async function saveConfig() {
  try {
    await window.calibration.saveConfig(config);
    toast('Config saved');
  } catch (e) {
    toast('Save failed: ' + e.message);
  }
}

async function loadConfig() {
  try {
    let saved = await window.calibration.loadConfig();
    if (saved) {
      if (saved.aspect_ratios) saved = saved.aspect_ratios;
      for (const ar of Object.keys(DEFAULT_CALIBRATION)) {
        if (!saved[ar]) saved[ar] = JSON.parse(JSON.stringify(DEFAULT_CALIBRATION[ar]));
      }
      const validKeys = new Set(Object.keys(DEFAULT_CALIBRATION));
      for (const k of Object.keys(saved)) {
        if (!validKeys.has(k)) delete saved[k];
      }
      for (const ar of Object.keys(saved)) {
        if (saved[ar].screenshots && !saved[ar]._screenshots) {
          saved[ar]._screenshots = saved[ar].screenshots;
          delete saved[ar].screenshots;
        }
      }
      config = saved;
      buildARToggle();
      buildScreenList();
      buildRegionPanel();
      drawOverlay();
      toast('Config loaded');
    } else {
      toast('No saved config found, using defaults');
    }
  } catch (e) {
    toast('Load failed: ' + e.message);
  }
}

function clearRegions() {
  if (!confirm(`Clear all ${currentAR} regions for ${currentScreen}?`)) return;
  setScreenRegions({});
  buildRegionPanel();
  buildScreenList();
  drawOverlay();
}

// ── Debug ───────────────────────────────────────────────────────────────────

async function runDebug() {
  if (!currentScreenshotPath) return;
  const panel = document.getElementById('debug-panel');
  const content = document.getElementById('debug-content');
  content.innerHTML = '<div class="d-section"><div class="d-label">Running debug pipeline...</div></div>';
  panel.classList.add('open');
  document.getElementById('bb-status').textContent = 'Running...';

  try {
    const data = await window.calibration.runDebug(currentScreenshotPath);
    renderDebug(data);
  } catch (e) {
    content.innerHTML = `<div class="d-section"><div class="d-error">Error: ${e.message}</div></div>`;
  }
  document.getElementById('bb-status').textContent = '';
}

function renderDebug(data) {
  const content = document.getElementById('debug-content');
  let html = '';

  if (data.error) {
    html = `<div class="d-section"><div class="d-error">${data.error}</div></div>`;
    content.innerHTML = html;
    return;
  }

  html += `<div class="d-section">
    <div class="d-row"><span class="d-label">Image:</span> <span class="d-value">${data.width}&times;${data.height}</span></div>
    <div class="d-row"><span class="d-label">Screen type:</span> <span class="d-value">${data.screen_type}</span></div>
  </div>`;

  if (data.rows && data.rows.length > 0) {
    html += `<div class="d-section"><div class="d-label">Rows detected: ${data.rows.length}</div></div>`;
    for (const [i, row] of data.rows.entries()) {
      html += `<div class="d-section">
        <div class="d-label">Row ${i}</div>
        <div class="d-row">Placement: <span class="d-value">${row.placement || '-'}</span></div>
        <div class="d-row">Level: <span class="d-value">${row.level || '-'}</span></div>
        <div class="d-row">W-L: <span class="d-value">${row.wl || '-'}</span></div>
        <div class="d-row">Rank: <span class="d-value">${row.rank || '-'} (${row.rank_change || '-'})</span></div>
        <div class="d-row">Units: <span class="d-value">${(row.units || []).join(', ') || '-'}</span></div>
        <div class="d-row">Synergies: <span class="d-value">${row.synergies || '-'}</span></div>
        <div class="d-row">Relics: <span class="d-value">${row.relic || '-'}</span></div>
        <div class="d-row">Time: <span class="d-value">${row.time_ago || '-'}</span></div>
      </div>`;
    }
  }

  if (data.game_data) {
    html += `<div class="d-section"><div class="d-label">Game Over Parse</div>
      <pre>${JSON.stringify(data.game_data, null, 2)}</pre>
    </div>`;
  }

  content.innerHTML = html;
}

function closeDebug() {
  document.getElementById('debug-panel').classList.remove('open');
}

async function runSentinelTest() {
  if (!currentScreenshotPath) return;
  const regions = getScreenRegions();
  const sr = regions.search_region;
  if (!sr || sr.length < 4) { toast('No search_region defined'); return; }

  document.getElementById('bb-status').textContent = 'Testing sentinel...';
  try {
    const data = await window.calibration.runSentinelTest(
      currentScreenshotPath,
      { x0: sr[0], y0: sr[1], x1: sr[2], y1: sr[3] },
    );
    const panel = document.getElementById('debug-panel');
    const content = document.getElementById('debug-content');
    let html = '';

    if (data.error) {
      html = `<div class="d-section"><div class="d-error">${data.error}</div></div>`;
    } else {
      html += `<div class="d-section"><div class="d-label">Sentinel Test Results</div>`;
      if (data.crop) {
        html += `<div class="d-row"><img src="data:image/jpeg;base64,${data.crop}" style="max-width:100%;border:1px solid var(--border);border-radius:3px;margin:4px 0;image-rendering:pixelated;"></div>`;
      }
      for (const [tpl, res] of Object.entries(data.results || {})) {
        const name = tpl.replace('sentinel_ref_', '').replace('.png', '');
        const scoreColor = res.score >= 0.7 ? 'var(--green)' : (res.score >= 0.5 ? 'var(--yellow)' : 'var(--red)');
        html += `<div class="d-row">${name}: <span style="color:${scoreColor};font-weight:600">${res.score}</span></div>`;
      }
      html += `</div>`;
    }

    content.innerHTML = html;
    panel.classList.add('open');
  } catch (e) {
    toast('Sentinel test failed: ' + e.message);
  }
  document.getElementById('bb-status').textContent = '';
}

// ── Toast ───────────────────────────────────────────────────────────────────

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ── Keyboard ────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (assigningRegion) {
      assigningRegion = null;
      updateModeTag();
      buildRegionPanel();
      drawOverlay();
    }
    closeDebug();
  }
  if (e.key === 'f' || e.key === 'F') zoomFit();
});

// ── Resize ──────────────────────────────────────────────────────────────────

window.addEventListener('resize', () => {
  resizeOverlay();
  drawOverlay();
});

// ── Auto-load screenshot for current screen type ────────────────────────────

async function loadSavedScreenshot() {
  const saved = getScreenshots()[currentScreen];
  if (saved) {
    const f = screenshotFiles.find(s => s.name === saved);
    if (f) {
      currentScreenshotPath = f.path;
      const dataUrl = await window.calibration.getScreenshot(f.path);
      if (dataUrl) loadImage(dataUrl);
      buildScreenshotList();
      document.getElementById('btn-debug').disabled = false;
      updateSentinelBtn();
      return;
    }
  }
  updateSentinelBtn();
}

const DEFAULT_SCREENSHOTS = {
  "21:9": {
    game_over: "20260205145859_1.jpg",
    my_matches: "ref_my_matches_21x9.png",
    sentinel_final_ranking: "ref_final_ranking_21x9.jpg",
    sentinel_round_start: "ref_round_start_21x9.jpg",
  }
};

function seedDefaultScreenshots() {
  for (const [ar, screens] of Object.entries(DEFAULT_SCREENSHOTS)) {
    if (!config[ar]) continue;
    if (!config[ar]._screenshots) config[ar]._screenshots = {};
    for (const [screen, name] of Object.entries(screens)) {
      if (!config[ar]._screenshots[screen]) {
        config[ar]._screenshots[screen] = name;
      }
    }
  }
}

// ── Init ────────────────────────────────────────────────────────────────────

buildARToggle();
buildScreenList();
buildRegionPanel();
fetchScreenshots().then(() => {
  loadConfig().then(() => {
    seedDefaultScreenshots();
    loadSavedScreenshot();
  });
});
