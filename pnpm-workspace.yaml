packages:
  - app
  - web
  - shared

# Security overrides for transitive dependencies whose direct parents have not
# yet released a fix. Re-check with `pnpm audit` and drop an entry once the
# parent ships the fix.
#
# Every range is caret-bounded on purpose. An open-ended ">=x.y.z" lets pnpm
# satisfy the override with a *newer major* — e.g. ">=1.1.16" on brace-expansion
# resolves to 5.x, which would be handed to minimatch@3 asking for "^1.1.7".
# Keep these bounded so each fix stays inside the major its parent expects.
overrides:
  # via app > electron-builder > app-builder-lib
  tar: "^7.5.21"
  js-yaml: "^4.3.0"
  form-data: "^4.0.6"
  fast-uri: "^3.1.4"
  undici: "^6.27.0"
  # three major lines are installed; each needs its own patched floor.
  # 1.1.16 and 2.1.2 are the newest releases on those lines and `pnpm audit`
  # still reports CVE-2026-14257 against them: the fix landed only in 5.0.8 and
  # was never backported. Clearing it would mean handing brace-expansion 5 (a
  # dual ESM/CJS rewrite) to minimatch@3/@5/@9, which expect the 1.x/2.x CJS
  # shape. Left as-is: both paths are electron-builder's, they run at package
  # time over globs from our own electron-builder.json, and no untrusted input
  # reaches them.
  brace-expansion@1: "^1.1.16"
  brace-expansion@2: "^2.1.2"
  brace-expansion@5: "^5.0.8"
  # via web > next
  postcss: "^8.5.18"
  sharp: "^0.35.0"
  # via posthog-js
  dompurify: "^3.4.12"
  # via app > vite
  esbuild: "^0.28.1"

allowBuilds:
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  sharp: true

