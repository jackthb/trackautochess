packages:
  - app
  - web
  - shared

# Security overrides for transitive dependencies whose direct parents have not
# yet released a fix. Re-check with `pnpm audit` and drop an entry once the
# parent ships the fix.
#
# Every range is caret-bounded on purpose. An open-ended ">=x.y.z" lets pnpm
# satisfy the override with a *newer major* — e.g. ">=1.1.16" on brace-expansion
# resolves to 5.x, which would be handed to minimatch@3 asking for "^1.1.7".
# Keep these bounded so each fix stays inside the major its parent expects.
overrides:
  # via app > electron-builder > app-builder-lib
  tar: "^7.5.21"
  js-yaml: "^4.3.0"
  form-data: "^4.0.6"
  # 3.1.5 fixes CVE-2026-18446 (host confusion via a backslash authority
  # introducer); reached through app-builder-lib > ajv.
  fast-uri: "^3.1.5"
  undici: "^6.27.0"
  # three major lines are installed; each needs its own patched floor.
  # Two chained DoS advisories apply, and the second one moves every floor:
  # CVE-2026-14257 (fixed in 1.1.17 / 2.1.3 / 5.0.8), then CVE-2026-69152, which
  # bypasses that first mitigation via unbounded intermediate arrays and is only
  # fixed in 1.1.18 / 2.1.4 / 5.0.9. Pin to the CVE-2026-69152 floors — the
  # CVE-2026-14257 ones look sufficient but still admit a vulnerable version.
  # Each line clears on its own major, so none of these has to jump to
  # brace-expansion 5 — that rewrite is dual ESM/CJS and minimatch@3/@5/@9
  # expect the 1.x/2.x CJS shape.
  brace-expansion@1: "^1.1.18"
  brace-expansion@2: "^2.1.4"
  brace-expansion@5: "^5.0.9"
  # via web > next
  postcss: "^8.5.18"
  sharp: "^0.35.0"
  # via posthog-js
  dompurify: "^3.4.12"
  # via app > vite
  esbuild: "^0.28.1"

allowBuilds:
  # Downloads the posthog-cli binary that @posthog/nextjs-config runs to upload
  # web source maps during `next build`.
  "@posthog/cli": true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  sharp: true

