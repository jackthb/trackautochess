<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>DAC Region Editor</title>
<style>
:root {
  --bg: #060608;
  --panel: #0b0b0f;
  --border: #1a1a24;
  --text: #b8b8c8;
  --text-dim: #555568;
  --text-bright: #e8e8f0;
  --green: #4ade80;
  --green-dim: #166534;
  --blue: #38bdf8;
  --red: #f87171;
  --yellow: #facc15;
  --orange: #f97316;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 12px;
  overflow: hidden; height: 100vh; user-select: none;
}

#toolbar {
  position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 50;
  background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px; padding: 0 14px;
}
.title { font-weight: 600; color: var(--text-bright); }
.ar-toggle { display: flex; gap: 2px; }
.ar-toggle button {
  background: transparent; color: var(--text-dim); border: 1px solid var(--border);
  padding: 5px 14px; cursor: pointer; font-family: inherit; font-size: 11px;
  border-radius: 3px;
}
.ar-toggle button.active {
  background: var(--green-dim); color: var(--green); border-color: #1a5c32;
}
.ar-toggle button:hover:not(.active) { background: var(--border); color: var(--text); }
.spacer { flex: 1; }
.btn {
  background: transparent; color: var(--text-dim); border: 1px solid var(--border);
  padding: 5px 14px; cursor: pointer; font-family: inherit; font-size: 11px;
  border-radius: 3px;
}
.btn:hover { background: var(--border); color: var(--text-bright); }
.btn.primary { background: var(--green-dim); color: var(--green); border-color: #1a5c32; }
.btn.primary:hover { background: #1a5c32; }
#status { font-size: 11px; color: var(--text-dim); min-width: 200px; text-align: right; }
#status.saved { color: var(--green); }
#status.dirty { color: var(--yellow); }
#status.err { color: var(--red); }

#viewport {
  position: fixed; top: 44px; left: 0; right: 240px; bottom: 0;
  overflow: hidden; background: var(--bg); cursor: default;
}
#viewport canvas { position: absolute; top: 0; left: 0; }
#imgCanvas { image-rendering: pixelated; }

#side {
  position: fixed; top: 44px; right: 0; width: 240px; bottom: 0;
  background: var(--panel); border-left: 1px solid var(--border);
  overflow-y: auto;
}
.legend { padding: 10px 12px; }
.legend h3 {
  font-size: 10px; color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 8px; font-weight: 600;
}
.reg-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 4px;
  font-size: 11px; border-radius: 3px; cursor: pointer;
}
.reg-row:hover { background: rgba(255,255,255,0.03); }
.reg-row.selected { background: rgba(56,189,248,0.08); }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.reg-name { flex: 1; color: var(--text); }
.reg-coords {
  font-size: 9px; color: var(--text-dim); padding: 0 4px 6px 22px;
  font-family: monospace;
}
.help {
  padding: 10px 12px; border-top: 1px solid var(--border);
  font-size: 10px; color: var(--text-dim); line-height: 1.6;
}
.help kbd {
  background: var(--border); padding: 1px 5px; border-radius: 2px;
  color: var(--text-bright); font-size: 10px;
}
</style>
</head><body>

<div id="toolbar">
  <div class="title">Region Editor — GAME OVER</div>
  <div class="ar-toggle" id="ar-toggle">
    <button data-ar="16:9">16:9</button>
    <button data-ar="21:9">21:9</button>
  </div>
  <span class="spacer"></span>
  <button class="btn" onclick="reload()">Reload</button>
  <button class="btn" onclick="resetToDefaults()">Reset</button>
  <button class="btn primary" onclick="save()">Save</button>
  <span id="status"></span>
</div>

<div id="viewport">
  <canvas id="imgCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>
</div>

<div id="side">
  <div class="legend">
    <h3>Regions (click to select)</h3>
    <div id="legend-list"></div>
  </div>
  <div class="help">
    <p><strong>Drag region body</strong> → move</p>
    <p><strong>Drag corner/edge</strong> → resize</p>
    <p><kbd>Esc</kbd> deselect &nbsp; <kbd>R</kbd> reset selected</p>
    <p>x-range columns (player/level/synergy/relic/wl) span the full table_area height — only the left/right edges move.</p>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const RECT_FIELDS = ['title_region', 'table_area'];
const XRANGE_FIELDS = ['col_player', 'col_level', 'col_synergy', 'col_relic', 'col_wl'];
const FIELD_ORDER = ['title_region', 'table_area', 'col_player', 'col_level', 'col_synergy', 'col_relic', 'col_wl'];
const N_ROWS = 8;
const COLORS = {
  title_region: '#facc15',
  table_area:   '#f87171',
  col_player:   '#4ade80',
  col_level:    '#f97316',
  col_synergy:  '#8ac4ff',
  col_relic:    '#f472b6',
  col_wl:       '#c084fc',
};
const DIVIDER_COLOR = '#fbbf24';
const HANDLE_PX = 8;     // half-size of handle in screen pixels
const EDGE_PX = 5;       // edge-grab tolerance in screen pixels
const DIVIDER_PX = 6;    // grab tolerance for dividers (vertical)

let config = null;        // full regions_config.json contents
let defaults = null;      // server-provided defaults
let currentAR = '21:9';
let regions = {};         // alias: config[currentAR].game_over
let img = null, imgW = 0, imgH = 0;
let zoom = 1, panX = 0, panY = 0;
let selected = null;
let dirty = false;
let drag = null;          // {field, kind: 'move'|'edge', edges: ['l','r','t','b'], startCoords, startMouse}

const viewport = document.getElementById('viewport');
const imgCanvas = document.getElementById('imgCanvas');
const overlayCanvas = document.getElementById('overlayCanvas');
const imgCtx = imgCanvas.getContext('2d');
const overlayCtx = overlayCanvas.getContext('2d');

// ── Load / Save ──────────────────────────────────────────────────────────────
async function fetchConfig() {
  const r = await fetch('/api/regions');
  const data = await r.json();
  config = data.config;
  defaults = data.defaults;
  bind();
}

function bind() {
  if (!config[currentAR]) config[currentAR] = { game_over: {} };
  if (!config[currentAR].game_over) config[currentAR].game_over = {};
  regions = config[currentAR].game_over;
  // Ensure all fields exist (copy from defaults if missing)
  const def = (defaults[currentAR] || {}).game_over || {};
  for (const f of FIELD_ORDER) {
    if (!Array.isArray(regions[f]) && Array.isArray(def[f])) {
      regions[f] = def[f].slice();
    }
  }
  // Initialise row_dividers from table_area / N_ROWS if missing
  if (!Array.isArray(regions.row_dividers) || regions.row_dividers.length !== N_ROWS + 1) {
    const ta = regions.table_area || [0, 0.12585, 1, 0.8872];
    const y0 = ta[1], y1 = ta[3];
    regions.row_dividers = [];
    for (let i = 0; i <= N_ROWS; i++) {
      regions.row_dividers.push(round(y0 + (y1 - y0) * (i / N_ROWS)));
    }
  }
  loadScreenshot();
  buildLegend();
}

function loadScreenshot() {
  const name = (config[currentAR]._screenshots || {}).game_over;
  if (!name) {
    setStatus('No saved screenshot for ' + currentAR, 'err');
    return;
  }
  const i = new Image();
  i.onload = () => {
    img = i; imgW = i.width; imgH = i.height;
    imgCanvas.width = imgW; imgCanvas.height = imgH;
    imgCtx.drawImage(i, 0, 0);
    fitZoom();
  };
  i.onerror = () => setStatus('Failed to load ' + name, 'err');
  i.src = '/screenshots/' + encodeURIComponent(name);
}

async function save() {
  setStatus('Saving…');
  try {
    const r = await fetch('/api/regions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(config),
    });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    dirty = false;
    setStatus('Saved to ' + (j.paths || []).join(', '), 'saved');
  } catch (e) {
    setStatus('Save failed: ' + e.message, 'err');
  }
}

function reload() { fetchConfig(); setStatus('Reloaded'); dirty = false; }

function resetToDefaults() {
  if (!selected || !defaults) return;
  const def = (defaults[currentAR] || {}).game_over || {};
  if (!Array.isArray(def[selected])) return;
  regions[selected] = def[selected].slice();
  markDirty(); draw(); buildLegend();
}

function setStatus(msg, cls='') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}
function markDirty() { dirty = true; setStatus('Unsaved changes', 'dirty'); }

// ── Coords ───────────────────────────────────────────────────────────────────
function rectFromField(field) {
  const v = regions[field];
  if (!Array.isArray(v)) return null;
  if (v.length === 4) return { x0: v[0], y0: v[1], x1: v[2], y1: v[3] };
  if (v.length === 2) {
    const ta = regions.table_area || [0, 0.1, 1, 0.9];
    return { x0: v[0], y0: ta[1], x1: v[1], y1: ta[3] };
  }
  return null;
}
function writeField(field, x0, y0, x1, y1) {
  const v = regions[field];
  if (!Array.isArray(v)) return;
  if (v.length === 4) {
    regions[field] = [round(x0), round(y0), round(x1), round(y1)];
  } else {
    regions[field] = [round(x0), round(x1)];
  }
}
function round(v) { return Math.round(Math.max(0, Math.min(1, v)) * 100000) / 100000; }

// ── Render ───────────────────────────────────────────────────────────────────
function fitZoom() {
  if (!img) return;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  zoom = Math.min(vw / imgW, vh / imgH);
  panX = (vw - imgW * zoom) / 2;
  panY = (vh - imgH * zoom) / 2;
  applyTransform();
}
function applyTransform() {
  imgCanvas.style.transformOrigin = '0 0';
  imgCanvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  resizeOverlay();
  draw();
}
function resizeOverlay() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  if (overlayCanvas.width !== vw || overlayCanvas.height !== vh) {
    overlayCanvas.width = vw;
    overlayCanvas.height = vh;
  }
}

function imgToScreen(x, y) {
  return [panX + x * imgW * zoom, panY + y * imgH * zoom];
}
function screenToImg(sx, sy) {
  return [(sx - panX) / (imgW * zoom), (sy - panY) / (imgH * zoom)];
}

function draw() {
  if (!img) return;
  const ctx = overlayCtx;
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  // ── 9 draggable row dividers spanning table_area's x-range ────────────────
  const ta = regions.table_area || [0, 0, 1, 1];
  const dividers = regions.row_dividers || [];
  if (Array.isArray(dividers) && dividers.length === N_ROWS + 1) {
    const [sx0] = imgToScreen(ta[0], 0);
    const [sx1] = imgToScreen(ta[2], 0);
    ctx.save();
    for (let i = 0; i < dividers.length; i++) {
      const [, sy] = imgToScreen(0, dividers[i]);
      const isSel = (selected === `divider:${i}`);
      ctx.strokeStyle = isSel ? '#fff' : DIVIDER_COLOR;
      ctx.lineWidth = isSel ? 2.5 : 1.5;
      ctx.setLineDash(isSel ? [] : [6, 4]);
      ctx.beginPath();
      ctx.moveTo(sx0, sy);
      ctx.lineTo(sx1, sy);
      ctx.stroke();
      // grab handle in the middle
      ctx.setLineDash([]);
      ctx.fillStyle = DIVIDER_COLOR;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      const hx = sx0 + (sx1 - sx0) * 0.5;
      ctx.beginPath();
      ctx.rect(hx - HANDLE_PX, sy - HANDLE_PX/2, HANDLE_PX*2, HANDLE_PX);
      ctx.fill();
      ctx.stroke();
    }
    // Row labels on the left margin
    ctx.fillStyle = DIVIDER_COLOR;
    ctx.font = '600 10px "JetBrains Mono", monospace';
    for (let i = 0; i < N_ROWS; i++) {
      const [, sy_a] = imgToScreen(0, dividers[i]);
      const [, sy_b] = imgToScreen(0, dividers[i + 1]);
      ctx.fillText(`r${i}`, sx0 + 4, (sy_a + sy_b) / 2 + 4);
    }
    ctx.restore();
  }

  // ── Region rectangles ──────────────────────────────────────────────────────
  for (const field of FIELD_ORDER) {
    const r = rectFromField(field);
    if (!r) continue;
    const color = COLORS[field];
    const isSel = selected === field;
    const [sx0, sy0] = imgToScreen(r.x0, r.y0);
    const [sx1, sy1] = imgToScreen(r.x1, r.y1);
    const w = sx1 - sx0, h = sy1 - sy0;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = isSel ? 2.5 : 1.5;
    ctx.strokeRect(sx0, sy0, w, h);
    ctx.fillStyle = hexA(color, isSel ? 0.10 : 0.04);
    ctx.fillRect(sx0, sy0, w, h);
    // label
    ctx.font = '600 11px "JetBrains Mono", monospace';
    const tw = ctx.measureText(field).width;
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(sx0 + 2, sy0 + 2, tw + 8, 16);
    ctx.fillStyle = color;
    ctx.fillText(field, sx0 + 6, sy0 + 14);
    if (isSel) drawHandles(ctx, field, sx0, sy0, sx1, sy1, color);
    ctx.restore();
  }
}

function drawHandles(ctx, field, sx0, sy0, sx1, sy1, color) {
  const isX = XRANGE_FIELDS.includes(field);
  const mids = [
    {x: sx0, y: (sy0+sy1)/2, edges:['l']},
    {x: sx1, y: (sy0+sy1)/2, edges:['r']},
  ];
  if (!isX) {
    mids.push({x: (sx0+sx1)/2, y: sy0, edges:['t']});
    mids.push({x: (sx0+sx1)/2, y: sy1, edges:['b']});
    mids.push({x: sx0, y: sy0, edges:['l','t']});
    mids.push({x: sx1, y: sy0, edges:['r','t']});
    mids.push({x: sx0, y: sy1, edges:['l','b']});
    mids.push({x: sx1, y: sy1, edges:['r','b']});
  }
  ctx.fillStyle = color;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  for (const m of mids) {
    ctx.beginPath();
    ctx.rect(m.x - HANDLE_PX/2, m.y - HANDLE_PX/2, HANDLE_PX, HANDLE_PX);
    ctx.fill();
    ctx.stroke();
  }
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── Hit testing ──────────────────────────────────────────────────────────────
function hitDivider(mx, my) {
  const dividers = regions.row_dividers;
  const ta = regions.table_area;
  if (!Array.isArray(dividers) || !Array.isArray(ta)) return null;
  const [sx0] = imgToScreen(ta[0], 0);
  const [sx1] = imgToScreen(ta[2], 0);
  if (mx < sx0 - DIVIDER_PX || mx > sx1 + DIVIDER_PX) return null;
  let bestI = -1, bestDist = DIVIDER_PX + 1;
  for (let i = 0; i < dividers.length; i++) {
    const [, sy] = imgToScreen(0, dividers[i]);
    const d = Math.abs(my - sy);
    if (d < bestDist) { bestDist = d; bestI = i; }
  }
  return bestI >= 0 ? { divider: bestI } : null;
}

function hitTest(mx, my) {
  // Dividers win over regions because they sit on top of table_area edges
  const dh = hitDivider(mx, my);
  if (dh) return { kind: 'divider', index: dh.divider };
  // Iterate selected first, then in reverse legend order so smaller regions win
  const order = selected
    ? [selected, ...FIELD_ORDER.filter(f => f !== selected)]
    : FIELD_ORDER.slice();
  for (const field of order) {
    const r = rectFromField(field);
    if (!r) continue;
    const [sx0, sy0] = imgToScreen(r.x0, r.y0);
    const [sx1, sy1] = imgToScreen(r.x1, r.y1);
    const isX = XRANGE_FIELDS.includes(field);
    const onL = Math.abs(mx - sx0) <= EDGE_PX;
    const onR = Math.abs(mx - sx1) <= EDGE_PX;
    const onT = !isX && Math.abs(my - sy0) <= EDGE_PX;
    const onB = !isX && Math.abs(my - sy1) <= EDGE_PX;
    const inX = mx >= sx0 - EDGE_PX && mx <= sx1 + EDGE_PX;
    const inY = my >= sy0 - EDGE_PX && my <= sy1 + EDGE_PX;
    if (!inX || !inY) continue;
    const edges = [];
    if (onL) edges.push('l');
    if (onR) edges.push('r');
    if (onT) edges.push('t');
    if (onB) edges.push('b');
    if (edges.length) return { field, kind: 'edge', edges };
    if (mx > sx0 && mx < sx1 && my > sy0 && my < sy1) return { field, kind: 'move' };
  }
  return null;
}

function cursorFor(hit) {
  if (!hit) return 'default';
  if (hit.kind === 'divider') return 'ns-resize';
  if (hit.kind === 'move') return 'move';
  const e = hit.edges.join('');
  if (e === 'l' || e === 'r') return 'ew-resize';
  if (e === 't' || e === 'b') return 'ns-resize';
  if (e === 'lt' || e === 'rb') return 'nwse-resize';
  if (e === 'rt' || e === 'lb') return 'nesw-resize';
  return 'default';
}

// ── Mouse ────────────────────────────────────────────────────────────────────
viewport.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || !img) return;
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const hit = hitTest(mx, my);
  if (!hit) {
    selected = null;
    buildLegend();
    draw();
    return;
  }
  if (hit.kind === 'divider') {
    selected = `divider:${hit.index}`;
    drag = {
      kind: 'divider',
      index: hit.index,
      startY: regions.row_dividers[hit.index],
      mouse: { x: mx, y: my },
    };
    buildLegend();
    draw();
    return;
  }
  selected = hit.field;
  const r = rectFromField(hit.field);
  drag = {
    field: hit.field,
    kind: hit.kind,
    edges: hit.edges || [],
    start: { x0: r.x0, y0: r.y0, x1: r.x1, y1: r.y1 },
    mouse: { x: mx, y: my },
  };
  buildLegend();
  draw();
});

viewport.addEventListener('mousemove', (e) => {
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (!drag) {
    const hit = hitTest(mx, my);
    viewport.style.cursor = cursorFor(hit);
    return;
  }
  if (drag.kind === 'divider') {
    const dy = (my - drag.mouse.y) / (imgH * zoom);
    let v = drag.startY + dy;
    // Clamp to neighbors so dividers can't swap order
    const dividers = regions.row_dividers;
    const lo = drag.index > 0 ? dividers[drag.index - 1] + 0.001 : 0;
    const hi = drag.index < dividers.length - 1 ? dividers[drag.index + 1] - 0.001 : 1;
    v = Math.max(lo, Math.min(hi, v));
    dividers[drag.index] = round(v);
    // Keep table_area's y-range in sync with first/last divider so other
    // overlays (column rectangles etc.) follow.
    if (Array.isArray(regions.table_area) && regions.table_area.length === 4) {
      regions.table_area[1] = dividers[0];
      regions.table_area[3] = dividers[dividers.length - 1];
    }
    markDirty();
    draw();
    buildLegend();
    return;
  }
  const dx = (mx - drag.mouse.x) / (imgW * zoom);
  const dy = (my - drag.mouse.y) / (imgH * zoom);
  let { x0, y0, x1, y1 } = drag.start;
  if (drag.kind === 'move') {
    x0 += dx; x1 += dx; y0 += dy; y1 += dy;
  } else {
    if (drag.edges.includes('l')) x0 += dx;
    if (drag.edges.includes('r')) x1 += dx;
    if (drag.edges.includes('t')) y0 += dy;
    if (drag.edges.includes('b')) y1 += dy;
  }
  // Clamp 0..1, ensure x1>x0 etc.
  x0 = Math.max(0, Math.min(1, x0));
  x1 = Math.max(0, Math.min(1, x1));
  y0 = Math.max(0, Math.min(1, y0));
  y1 = Math.max(0, Math.min(1, y1));
  if (x1 < x0) [x0, x1] = [x1, x0];
  if (y1 < y0) [y0, y1] = [y1, y0];
  writeField(drag.field, x0, y0, x1, y1);
  // If moving table_area, redistribute dividers proportionally so they stay
  // anchored to the same row positions visually.
  if (drag.field === 'table_area' && Array.isArray(regions.row_dividers)) {
    const oldY0 = drag.start.y0, oldY1 = drag.start.y1;
    const oldSpan = oldY1 - oldY0;
    const newSpan = y1 - y0;
    if (oldSpan > 0 && newSpan > 0) {
      regions.row_dividers = regions.row_dividers.map(v =>
        round(y0 + ((v - oldY0) / oldSpan) * newSpan));
    }
  }
  markDirty();
  draw();
  buildLegend();
});

window.addEventListener('mouseup', () => { drag = null; });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { selected = null; buildLegend(); draw(); }
  if (e.key === 'r' || e.key === 'R') resetToDefaults();
});

window.addEventListener('resize', () => { fitZoom(); });

// ── AR toggle ────────────────────────────────────────────────────────────────
document.querySelectorAll('#ar-toggle button').forEach(b => {
  b.addEventListener('click', () => {
    if (dirty && !confirm('Discard unsaved changes?')) return;
    currentAR = b.dataset.ar;
    document.querySelectorAll('#ar-toggle button').forEach(x =>
      x.classList.toggle('active', x.dataset.ar === currentAR));
    selected = null;
    bind();
    setStatus('');
  });
});

// ── Legend ───────────────────────────────────────────────────────────────────
function buildLegend() {
  const list = document.getElementById('legend-list');
  list.innerHTML = '';
  for (const field of FIELD_ORDER) {
    const v = regions[field];
    const has = Array.isArray(v);
    const row = document.createElement('div');
    row.className = 'reg-row' + (selected === field ? ' selected' : '');
    row.innerHTML = `<span class="swatch" style="background:${COLORS[field]}"></span>
                     <span class="reg-name">${field}</span>`;
    row.onclick = () => { selected = field; buildLegend(); draw(); };
    list.appendChild(row);
    if (has) {
      const c = document.createElement('div');
      c.className = 'reg-coords';
      c.textContent = v.map(x => x.toFixed(4)).join(', ');
      list.appendChild(c);
    }
  }
  // Row dividers section
  const head = document.createElement('div');
  head.style.cssText = 'margin-top:14px;padding-top:8px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;';
  head.innerHTML = `<h3 style="flex:1;margin:0;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:1px">Row dividers (drag any line)</h3>
                    <button class="btn" style="padding:2px 8px;font-size:10px" id="resetDivBtn">Reset</button>`;
  list.appendChild(head);
  document.getElementById('resetDivBtn').onclick = resetDividers;
  const dividers = regions.row_dividers || [];
  for (let i = 0; i < dividers.length; i++) {
    const sel = selected === `divider:${i}`;
    const r = document.createElement('div');
    r.className = 'reg-row' + (sel ? ' selected' : '');
    const label = i === 0 ? 'top' : (i === dividers.length - 1 ? 'bottom' : `r${i-1}/r${i}`);
    r.innerHTML = `<span class="swatch" style="background:${DIVIDER_COLOR}"></span>
                   <span class="reg-name">div ${i} <span style="color:var(--text-dim)">(${label})</span></span>
                   <span style="color:var(--text-dim);font-family:monospace;font-size:10px">${dividers[i].toFixed(4)}</span>`;
    r.onclick = () => { selected = `divider:${i}`; buildLegend(); draw(); };
    list.appendChild(r);
  }
}

function resetDividers() {
  if (!regions.table_area) return;
  const ta = regions.table_area;
  const y0 = ta[1], y1 = ta[3];
  regions.row_dividers = [];
  for (let i = 0; i <= N_ROWS; i++) {
    regions.row_dividers.push(round(y0 + (y1 - y0) * (i / N_ROWS)));
  }
  markDirty();
  buildLegend();
  draw();
}

// ── Init ─────────────────────────────────────────────────────────────────────
document.querySelector(`#ar-toggle button[data-ar="${currentAR}"]`).classList.add('active');
fetchConfig();
</script>
</body></html>
