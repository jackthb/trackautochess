<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Track Auto Chess — Setup</title>
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<link rel="stylesheet" href="config.css" />
</head>
<body>
<main class="wrap">
  <h1>Track Auto Chess setup</h1>
  <p class="lead">
    Enter your Steam username, vanity URL, or SteamID64. The panel will stay
    small and show viewers only your current DAC rank.
  </p>

  <form id="form">
    <label for="steamInput">Steam username or SteamID64</label>
    <input
      id="steamInput"
      type="text"
      placeholder="e.g. jackth or 76561198022169086"
      autocomplete="off"
      required
    />
    <p class="hint">
      Use the username from
      <code>steamcommunity.com/id/<strong>your-name</strong></code>
      or your numeric SteamID64.
    </p>

    <button id="submit" type="submit">Save</button>
  </form>

  <div id="current" class="current hidden">
    <strong>Current setup:</strong>
    <span id="currentName"></span>
    <a id="currentProfile" target="_blank" rel="noopener noreferrer">View profile ↗</a>
  </div>

  <div id="status" class="status hidden"></div>
</main>
<script src="config.js"></script>
</body>
</html>
