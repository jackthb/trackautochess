<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Track Auto Chess</title>
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<link rel="stylesheet" href="panel.css" />
</head>
<body>
<main id="root" class="panel-shell">
  <section id="loading" class="state-card">Loading rank...</section>

  <section id="unconfigured" class="state-card hidden">
    <img class="brand-mark" src="logo.svg" alt="" />
    <p class="eyebrow">Track Auto Chess</p>
    <h1>No player linked</h1>
    <p class="muted">Broadcaster: add your Steam username or SteamID64 in setup.</p>
  </section>

  <article id="content" class="rank-panel hidden" aria-live="polite">
    <header class="panel-header">
      <div class="brand" aria-label="Track Auto Chess">
        <img src="logo.svg" alt="" />
        <span>Track Auto Chess</span>
      </div>
      <span id="season" class="season muted"></span>
    </header>

    <a id="profile-link" class="player-header" target="_blank" rel="noopener noreferrer">
      <span class="player-heading">
        <span id="name" class="player-name"></span>
        <span id="profile-meta" class="player-meta muted">Public DAC profile</span>
      </span>
    </a>

    <section class="rank-hero">
      <span class="stat-label">Current rank</span>
      <strong id="rank" class="rank-value">--</strong>
      <span id="mmr" class="rank-subvalue">-- MMR</span>
    </section>

    <section class="stats-grid" aria-label="Public Auto Chess profile stats">
      <div class="stat-cell">
        <span class="stat-label">Peak MMR</span>
        <strong id="max-mmr" class="stat-value">--</strong>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Win Rate</span>
        <strong id="win-rate" class="stat-value gold">--</strong>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Wins</span>
        <strong id="chicken-count" class="stat-value gold">--</strong>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Games</span>
        <strong id="season-games" class="stat-value">--</strong>
      </div>
      <div class="stat-cell wide-stat">
        <span class="stat-label">Candies</span>
        <strong id="candy" class="stat-value gold">--</strong>
      </div>
    </section>
    <div id="updated" class="updated muted"></div>
  </article>

  <section id="error" class="state-card hidden"></section>
</main>
<script src="panel.js"></script>
</body>
</html>
