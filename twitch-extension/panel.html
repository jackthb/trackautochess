<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Track Auto Chess</title>
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<link rel="stylesheet" href="panel.css" />
</head>
<body>
<div id="root" class="panel">
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <path id="bishop" d="M 256 52 C 240 52, 228 64, 228 80 C 228 90, 233 99, 241 104 L 220 160 C 190 170, 168 200, 168 236 C 168 260, 178 282, 196 296 L 180 340 C 170 348, 164 362, 164 376 L 164 392 L 148 392 C 140 392, 132 400, 132 408 L 132 440 C 132 448, 140 456, 148 456 L 364 456 C 372 456, 380 448, 380 440 L 380 408 C 380 400, 372 392, 364 392 L 348 392 L 348 376 C 348 362, 342 348, 332 340 L 316 296 C 334 282, 344 260, 344 236 C 344 200, 322 170, 292 160 L 271 104 C 279 99, 284 90, 284 80 C 284 64, 272 52, 256 52 Z" />
        <clipPath id="clip-top"><polygon points="115,0 512,0 512,397" /></clipPath>
        <clipPath id="clip-mid"><polygon points="0,0 85,0 512,427 512,512 427,512 0,85" /></clipPath>
        <clipPath id="clip-bot"><polygon points="0,115 397,512 0,512" /></clipPath>
        <linearGradient id="r1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FF6046" /><stop offset="100%" stop-color="#E0402A" />
        </linearGradient>
        <linearGradient id="r2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#CC3520" /><stop offset="100%" stop-color="#B02A18" />
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="64" fill="#1B2838" />
      <g clip-path="url(#clip-top)" transform="translate(5,-5)"><use href="#bishop" fill="url(#r1)" /></g>
      <g clip-path="url(#clip-mid)"><use href="#bishop" fill="url(#r1)" /></g>
      <g clip-path="url(#clip-bot)" transform="translate(-5,5)"><use href="#bishop" fill="url(#r2)" /></g>
    </svg>
    <span class="brand-wordmark">TRACK AUTO CHESS</span>
  </div>
  <div id="loading" class="state">Loading…</div>
  <div id="unconfigured" class="state hidden">
    <p>This channel hasn't linked a Track Auto Chess profile yet.</p>
    <p class="muted">Broadcaster: set your Steam ID in the extension's configuration panel.</p>
  </div>
  <div id="content" class="hidden">
    <header>
      <img id="avatar" alt="" />
      <div class="who">
        <a id="name" target="_blank" rel="noopener noreferrer"></a>
        <span id="rank-line" class="muted"></span>
      </div>
    </header>
    <div class="stats">
      <div class="stat"><span class="label">MMR</span><span id="mmr" class="value">—</span></div>
      <div class="stat"><span class="label">Peak (season)</span><span id="max-mmr" class="value">—</span></div>
      <div class="stat"><span class="label">Season games</span><span id="games" class="value">—</span></div>
      <div class="stat"><span class="label">Top 1 rate</span><span id="chickens" class="value">—</span></div>
      <div class="stat"><span class="label">Lifetime wins</span><span id="total-chickens" class="value">—</span></div>
      <div class="stat"><span class="label">Lifetime peak</span><span id="lifetime-peak" class="value">—</span></div>
      <div class="stat"><span class="label">Lifetime games</span><span id="total-games" class="value">—</span></div>
      <div class="stat"><span class="label">Candy</span><span id="candy" class="value">—</span></div>
    </div>
    <div id="graph-wrap" class="graph-wrap hidden">
      <h2>MMR history</h2>
      <svg id="graph" class="graph" viewBox="0 0 280 90" preserveAspectRatio="none"></svg>
    </div>
    <footer>
      <a id="profile-link" target="_blank" rel="noopener noreferrer">View full profile →</a>
    </footer>
  </div>
  <div id="error" class="state hidden"></div>
</div>
<script src="panel.js"></script>
</body>
</html>
