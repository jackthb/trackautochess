<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 12px;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: #18181b;
      color: #efeff1;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #bf94ff;
    }
    #status {
      font-size: 12px;
      margin-bottom: 10px;
      color: #adadb8;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
    }
    #btn-start { background: #9147ff; color: #fff; }
    #btn-start:hover { background: #772ce8; }
    #btn-stop  { background: #3a3a3d; color: #efeff1; display: none; }
    #btn-stop:hover  { background: #53535f; }
  </style>
</head>
<body>
  <h2>DAC Translator</h2>
  <div id="status">Stopped</div>
  <button id="btn-start">▶ Start</button>
  <button id="btn-stop">■ Stop</button>
  <script src="popup.js"></script>
</body>
</html>
