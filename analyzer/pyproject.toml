[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dac-analyzer"
version = "0.1.0"
description = "Dota Auto Chess VOD Analyzer - extract game state from YouTube VODs"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0",
    "anthropic>=0.40.0",
    "Pillow>=10.0",
    "click>=8.0",
]

[project.optional-dependencies]
local = [
    "httpx>=0.27",
]

[project.scripts]
dac-analyzer = "dac_analyzer.cli:cli"
dac = "dac_analyzer.cli:cli"

[tool.setuptools.packages.find]
include = ["dac_analyzer*"]

[tool.setuptools.package-data]
"dac_analyzer" = ["prompts/*.txt", "data/*.json"]
