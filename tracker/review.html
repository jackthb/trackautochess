<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DAC Detection Review</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e; color: #eee; font-family: system-ui, sans-serif;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}

/* Top bar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; background: #16213e; border-bottom: 1px solid #333;
}
.topbar h1 { font-size: 16px; font-weight: 600; }
.progress { font-size: 14px; color: #aaa; }
.progress-bar {
  width: 200px; height: 8px; background: #333; border-radius: 4px;
  overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 8px;
}
.progress-fill { height: 100%; background: #4ecca3; transition: width 0.2s; }

/* Main area */
.main {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 16px; gap: 16px; position: relative;
}

/* Detection display */
.detection-card {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.crop-container {
  position: relative; display: inline-block;
  border: 2px solid #333; border-radius: 4px; overflow: hidden;
}
.crop-container img { display: block; image-rendering: pixelated; }
.bbox-overlay {
  position: absolute; border: 2px solid #ff4444; pointer-events: none;
}
.ref-icon-overlay {
  position: absolute; pointer-events: none; image-rendering: pixelated;
  opacity: 0.5; border: 2px solid #4ecca3;
}
.info-row {
  display: flex; align-items: center; gap: 16px; font-size: 18px;
}
.predicted-name {
  font-weight: bold; font-size: 22px; color: #4ecca3;
}
.score { color: #888; font-size: 14px; }
.ref-icon { width: 48px; height: 48px; image-rendering: pixelated; border: 1px solid #555; border-radius: 4px; }
.screenshot-name { color: #666; font-size: 12px; }

/* Controls */
.controls {
  display: flex; gap: 12px; align-items: center;
}
.controls button {
  padding: 8px 20px; border: none; border-radius: 6px; font-size: 15px;
  cursor: pointer; font-weight: 600;
}
.btn-approve { background: #4ecca3; color: #1a1a2e; }
.btn-wrong { background: #e74c3c; color: #fff; }
.btn-reject { background: #555; color: #ccc; }
.btn-undo { background: #444; color: #aaa; }
.kbd { font-size: 11px; color: #888; display: block; margin-top: 2px; }

/* Navigation */
.nav-row {
  display: flex; gap: 8px; align-items: center; color: #666; font-size: 13px;
}
.nav-row button {
  padding: 4px 12px; border: 1px solid #444; background: #2a2a4a;
  color: #aaa; border-radius: 4px; cursor: pointer; font-size: 13px;
}

/* Reviewed indicator */
.reviewed-badge {
  font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 600;
}
.reviewed-badge.approved { background: #2d6a4f; color: #b7e4c7; }
.reviewed-badge.corrected { background: #5a3d1e; color: #f0c27f; }
.reviewed-badge.rejected { background: #5a1e1e; color: #f0a0a0; }

/* Filter tabs */
.filter-row {
  display: flex; gap: 4px; font-size: 13px;
}
.filter-row button {
  padding: 3px 10px; border: 1px solid #444; background: transparent;
  color: #888; border-radius: 12px; cursor: pointer;
}
.filter-row button.active { background: #4ecca3; color: #1a1a2e; border-color: #4ecca3; }

/* Icon picker overlay */
.picker-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85); z-index: 100; display: none;
  flex-direction: column; align-items: center; padding: 24px;
}
.picker-overlay.open { display: flex; }
.picker-search {
  width: 300px; padding: 8px 12px; font-size: 16px; border: 2px solid #4ecca3;
  border-radius: 6px; background: #1a1a2e; color: #eee; margin-bottom: 16px;
  outline: none;
}
.picker-grid {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  overflow-y: auto; max-height: calc(100vh - 100px); padding: 8px;
}
.picker-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px; border-radius: 6px; cursor: pointer; width: 72px;
  border: 2px solid transparent;
}
.picker-item:hover, .picker-item.highlighted { border-color: #4ecca3; background: #2a2a4a; }
.picker-item img { width: 48px; height: 48px; image-rendering: pixelated; }
.picker-item span { font-size: 9px; color: #aaa; text-align: center; word-break: break-all; }

/* Empty state */
.empty { color: #666; font-size: 18px; text-align: center; padding: 40px; }

/* YOLO export button */
.export-btn {
  position: fixed; bottom: 16px; right: 16px;
  padding: 8px 16px; background: #16213e; color: #4ecca3;
  border: 1px solid #4ecca3; border-radius: 6px; cursor: pointer; font-size: 13px;
}
.export-btn:hover { background: #4ecca3; color: #1a1a2e; }
</style>
</head>
<body>
<div class="topbar">
  <h1>DAC Detection Review</h1>
  <div class="filter-row">
    <button data-filter="unreviewed" class="active">Unreviewed</button>
    <button data-filter="all">All</button>
    <button data-filter="approved">Approved</button>
    <button data-filter="corrected">Corrected</button>
    <button data-filter="rejected">Rejected</button>
  </div>
  <div class="progress">
    <span id="progress-text">0/0</span>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
</div>

<div class="main" id="main">
  <div class="detection-card" id="card" style="display:none">
    <div class="screenshot-name" id="screenshot-name"></div>
    <div class="crop-container" id="crop-container">
      <img id="crop-img" alt="crop">
      <div class="bbox-overlay" id="bbox"></div>
      <img class="ref-icon-overlay" id="ref-icon-overlay" alt="ref overlay">
    </div>
    <div class="info-row">
      <img class="ref-icon" id="ref-icon" alt="ref">
      <span class="predicted-name" id="predicted-name"></span>
      <span class="score" id="score"></span>
      <span class="reviewed-badge" id="reviewed-badge" style="display:none"></span>
    </div>
    <div class="controls">
      <button class="btn-approve" onclick="approve()">Correct <span class="kbd">J</span></button>
      <button class="btn-wrong" onclick="openPicker()">Wrong <span class="kbd">K</span></button>
      <button class="btn-reject" onclick="reject()">Not a unit <span class="kbd">X</span></button>
      <button class="btn-undo" onclick="undo()">Undo <span class="kbd">U</span></button>
    </div>
    <div class="nav-row">
      <button onclick="navigate(-1)">&larr; Prev</button>
      <span id="nav-pos">1/1</span>
      <button onclick="navigate(1)">Next &rarr;</button>
    </div>
  </div>
  <div class="empty" id="empty">Loading...</div>
</div>

<div class="picker-overlay" id="picker">
  <input class="picker-search" id="picker-search" placeholder="Search unit name..." autofocus>
  <div class="picker-grid" id="picker-grid"></div>
</div>

<button class="export-btn" onclick="exportYolo()">Export YOLO</button>

<script>
let data = null;
let filtered = [];     // flat list of {screenshot, detection} refs
let currentIdx = 0;
let currentFilter = "unreviewed";
const CROP_PAD = 100;
const CROP_SCALE = 3;  // display scale for crops

async function init() {
  const resp = await fetch("/api/detections");
  data = await resp.json();
  buildPicker();
  applyFilter();
  showCurrent();
}

function applyFilter() {
  filtered = [];
  for (const ss of data.screenshots) {
    for (const det of ss.detections) {
      let include = false;
      if (currentFilter === "all") include = true;
      else if (currentFilter === "unreviewed") include = det.reviewed === null;
      else if (currentFilter === "approved") include = det.reviewed === true && det.corrected === null;
      else if (currentFilter === "corrected") include = det.reviewed === true && det.corrected !== null;
      else if (currentFilter === "rejected") include = det.reviewed === false;
      if (include) filtered.push({ screenshot: ss, detection: det });
    }
  }
  // Sort by score descending — review high confidence first
  filtered.sort((a, b) => b.detection.score - a.detection.score);
  updateProgress();
}

function updateProgress() {
  let total = 0, reviewed = 0;
  for (const ss of data.screenshots) {
    for (const det of ss.detections) {
      total++;
      if (det.reviewed !== null) reviewed++;
    }
  }
  document.getElementById("progress-text").textContent = `${reviewed}/${total} reviewed`;
  document.getElementById("progress-fill").style.width = total ? `${(reviewed/total*100).toFixed(1)}%` : "0%";
}

function showCurrent() {
  const card = document.getElementById("card");
  const empty = document.getElementById("empty");

  if (filtered.length === 0) {
    card.style.display = "none";
    empty.style.display = "block";
    empty.textContent = currentFilter === "unreviewed" ? "All reviewed!" : "No detections match filter.";
    return;
  }

  card.style.display = "flex";
  empty.style.display = "none";
  if (currentIdx >= filtered.length) currentIdx = filtered.length - 1;
  if (currentIdx < 0) currentIdx = 0;

  const { screenshot, detection } = filtered[currentIdx];
  const det = detection;

  document.getElementById("screenshot-name").textContent = screenshot.file;
  document.getElementById("nav-pos").textContent = `${currentIdx + 1}/${filtered.length}`;

  // Info
  const displayName = det.corrected || det.predicted;

  // Load crop
  const cropUrl = `/api/crop?file=${encodeURIComponent(screenshot.file)}&x=${det.x}&y=${det.y}&w=${det.w}&h=${det.h}&pad=${CROP_PAD}`;
  const img = document.getElementById("crop-img");
  img.onload = function() {
    // Scale up for visibility
    img.style.width = (img.naturalWidth * CROP_SCALE) + "px";
    img.style.height = (img.naturalHeight * CROP_SCALE) + "px";
    // Position bbox overlay
    const bbox = document.getElementById("bbox");
    // bbox coords relative to crop
    const padX = det.x - Math.max(det.x - CROP_PAD, 0);
    const padY = det.y - Math.max(det.y - CROP_PAD, 0);
    bbox.style.left = (padX * CROP_SCALE) + "px";
    bbox.style.top = (padY * CROP_SCALE) + "px";
    bbox.style.width = (det.w * CROP_SCALE) + "px";
    bbox.style.height = (det.h * CROP_SCALE) + "px";
    // Position reference icon overlay right next to bbox
    const refOverlay = document.getElementById("ref-icon-overlay");
    refOverlay.src = `/icons/units/${displayName}.png`;
    refOverlay.style.left = (padX * CROP_SCALE + det.w * CROP_SCALE + 4) + "px";
    refOverlay.style.top = (padY * CROP_SCALE) + "px";
    refOverlay.style.width = (det.w * CROP_SCALE) + "px";
    refOverlay.style.height = (det.h * CROP_SCALE) + "px";
  };
  img.src = cropUrl;
  document.getElementById("predicted-name").textContent = displayName;
  document.getElementById("score").textContent = `score: ${det.score.toFixed(3)}`;
  document.getElementById("ref-icon").src = `/icons/units/${displayName}.png`;

  // Review status badge
  const badge = document.getElementById("reviewed-badge");
  if (det.reviewed === true && det.corrected) {
    badge.style.display = "inline";
    badge.className = "reviewed-badge corrected";
    badge.textContent = `was: ${det.predicted}`;
  } else if (det.reviewed === true) {
    badge.style.display = "inline";
    badge.className = "reviewed-badge approved";
    badge.textContent = "approved";
  } else if (det.reviewed === false) {
    badge.style.display = "inline";
    badge.className = "reviewed-badge rejected";
    badge.textContent = "rejected";
  } else {
    badge.style.display = "none";
  }
}

function navigate(delta) {
  currentIdx += delta;
  if (currentIdx < 0) currentIdx = 0;
  if (currentIdx >= filtered.length) currentIdx = filtered.length - 1;
  showCurrent();
}

async function sendReview(action, corrected) {
  if (filtered.length === 0) return;
  const { screenshot, detection } = filtered[currentIdx];
  const body = {
    file: screenshot.file,
    detection_id: detection.id,
    action,
  };
  if (corrected) body.corrected = corrected;

  await fetch("/api/review", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  // Update local state
  if (action === "approve") {
    detection.reviewed = true;
    detection.corrected = null;
  } else if (action === "correct") {
    detection.reviewed = true;
    detection.corrected = corrected;
  } else if (action === "reject") {
    detection.reviewed = false;
    detection.corrected = null;
  } else if (action === "undo") {
    detection.reviewed = null;
    detection.corrected = null;
  }

  applyFilter();

  // For undo, stay at current position; otherwise advance
  if (action !== "undo") {
    // If filtering unreviewed, the current item disappears from list
    if (currentFilter === "unreviewed") {
      // currentIdx now points to next item automatically
    } else {
      currentIdx++;
    }
  }
  showCurrent();
}

function approve() { sendReview("approve"); }
function reject() { sendReview("reject"); }
function undo() { sendReview("undo"); }

// Picker
function buildPicker() {
  const grid = document.getElementById("picker-grid");
  grid.innerHTML = "";
  for (const cls of data.classes) {
    const div = document.createElement("div");
    div.className = "picker-item";
    div.dataset.name = cls;
    div.innerHTML = `<img src="/icons/units/${cls}.png" alt="${cls}"><span>${cls}</span>`;
    div.onclick = () => pickUnit(cls);
    grid.appendChild(div);
  }
}

function openPicker() {
  if (filtered.length === 0) return;
  const picker = document.getElementById("picker");
  picker.classList.add("open");
  const search = document.getElementById("picker-search");
  search.value = "";
  search.focus();
  filterPicker("");
}

function closePicker() {
  document.getElementById("picker").classList.remove("open");
}

function filterPicker(query) {
  const items = document.querySelectorAll(".picker-item");
  const q = query.toLowerCase();
  let visible = [];
  for (const item of items) {
    const show = item.dataset.name.includes(q);
    item.style.display = show ? "" : "none";
    item.classList.remove("highlighted");
    if (show) visible.push(item);
  }
  // Auto-highlight if only one result
  if (visible.length === 1) {
    visible[0].classList.add("highlighted");
  }
}

function getHighlightedOrSingle() {
  const visible = [...document.querySelectorAll(".picker-item")].filter(i => i.style.display !== "none");
  if (visible.length === 1) return visible[0].dataset.name;
  const highlighted = visible.find(i => i.classList.contains("highlighted"));
  return highlighted ? highlighted.dataset.name : null;
}

function pickUnit(name) {
  closePicker();
  sendReview("correct", name);
}

document.getElementById("picker-search").addEventListener("input", function() {
  filterPicker(this.value);
});

// Keyboard shortcuts
document.addEventListener("keydown", function(e) {
  const picker = document.getElementById("picker");
  if (picker.classList.contains("open")) {
    if (e.key === "Escape") {
      e.preventDefault();
      closePicker();
    } else if (e.key === "Enter") {
      e.preventDefault();
      const name = getHighlightedOrSingle();
      if (name) pickUnit(name);
    }
    return; // Let search input handle other keys
  }

  if (e.key === "j" || e.key === "J") { e.preventDefault(); approve(); }
  else if (e.key === "k" || e.key === "K") { e.preventDefault(); openPicker(); }
  else if (e.key === "x" || e.key === "X") { e.preventDefault(); reject(); }
  else if (e.key === "u" || e.key === "U") { e.preventDefault(); undo(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); navigate(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); navigate(1); }
});

// Filter buttons
document.querySelectorAll(".filter-row button").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".filter-row button").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    currentFilter = this.dataset.filter;
    currentIdx = 0;
    applyFilter();
    showCurrent();
  });
});

// YOLO export
async function exportYolo() {
  const resp = await fetch("/api/export/yolo");
  const result = await resp.json();
  if (result.error) {
    alert("Error: " + result.error);
  } else {
    alert(`Exported YOLO dataset:\n${result.images} images, ${result.labels} labels, ${result.classes} classes\n→ ${result.output_dir}`);
  }
}

init();
</script>
</body>
</html>
