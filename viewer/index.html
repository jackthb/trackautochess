<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAC Replay Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0c10;
      --bg-secondary: #0e1117;
      --bg-tertiary: #161b22;
      --bg-hover: #1c2128;
      --border: #21262d;
      --text-primary: #e6edf3;
      --text-secondary: #7d8590;
      --text-tertiary: #484f58;
      --accent: #4a6fa5;
      --accent-hover: #5a8fd5;
      --danger: #da3633;
      --danger-hover: #f85149;
      --success: #3fb950;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* ── Layout ─────────────────────────────────────────────── */

    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: 100vh;
    }

    /* ── Sidebar ────────────────────────────────────────────── */

    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    .sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }

    .sidebar-header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
      padding-top: 8px;
    }

    .stats-bar {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .stats-bar span {
      color: var(--text-secondary);
    }

    .sidebar-actions {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }

    .btn-small {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-small:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--text-tertiary);
    }

    .replay-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .replay-list::-webkit-scrollbar {
      width: 6px;
    }

    .replay-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .replay-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .replay-item {
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.12s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .replay-item:hover {
      background: var(--bg-hover);
    }

    .replay-item.active {
      background: var(--bg-tertiary);
      border-left-color: var(--accent);
    }

    .replay-item-info {
      min-width: 0;
    }

    .replay-item-date {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .replay-item-meta {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .replay-item-actions {
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }

    .replay-item:hover .replay-item-actions {
      opacity: 1;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: rgba(218, 54, 51, 0.1);
    }

    /* ── Player panel ───────────────────────────────────────── */

    .player-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      -webkit-app-region: no-drag;
    }

    .player-topbar {
      height: 36px;
      -webkit-app-region: drag;
    }

    .player-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .player-wrapper {
      width: 100%;
      max-width: 1200px;
      position: relative;
    }

    video {
      width: 100%;
      border-radius: 8px;
      background: #000;
      outline: none;
    }

    /* ── Empty state ────────────────────────────────────────── */

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-tertiary);
      gap: 12px;
      padding: 24px;
    }

    .empty-state-icon {
      font-size: 48px;
      opacity: 0.3;
    }

    .empty-state-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .empty-state-desc {
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
      max-width: 280px;
    }

    /* ── Replay info bar (below video) ──────────────────────── */

    .replay-info-bar {
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .replay-filename {
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      color: var(--text-secondary);
    }

    /* ── Confirm dialog ─────────────────────────────────────── */

    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .confirm-dialog {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      max-width: 360px;
    }

    .confirm-dialog h3 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .confirm-dialog p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-confirm {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-cancel {
      background: var(--bg-hover);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>Replays</h1>
        <div class="stats-bar">
          <div><span id="replay-count">0</span> replays</div>
          <div><span id="replay-size">0</span> GB used</div>
          <div><span id="replay-limit">15</span> GB limit</div>
        </div>
      </div>
      <div class="sidebar-actions">
        <button class="btn-small" id="btn-open-folder">Open folder</button>
        <button class="btn-small" id="btn-refresh">Refresh</button>
      </div>
      <div class="replay-list" id="replay-list"></div>
    </div>

    <!-- Player -->
    <div class="player-panel">
      <div class="player-topbar"></div>

      <!-- Empty state (no replay selected) -->
      <div class="empty-state" id="empty-state">
        <div class="empty-state-icon">&#9654;</div>
        <div class="empty-state-title">No replay selected</div>
        <div class="empty-state-desc">
          Select a replay from the sidebar to watch it. Replays are recorded
          automatically when you play Dota Auto Chess.
        </div>
      </div>

      <!-- Video player -->
      <div class="player-container hidden" id="player-container">
        <div class="player-wrapper">
          <video id="video" controls></video>
        </div>
      </div>

      <div class="replay-info-bar hidden" id="replay-info-bar">
        <span class="replay-filename" id="replay-filename"></span>
        <span id="replay-filesize"></span>
      </div>
    </div>
  </div>

  <!-- Delete confirmation -->
  <div class="confirm-overlay hidden" id="confirm-overlay">
    <div class="confirm-dialog">
      <h3>Delete replay?</h3>
      <p id="confirm-text">This cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn-confirm btn-cancel" id="btn-confirm-cancel">Cancel</button>
        <button class="btn-confirm btn-danger" id="btn-confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const replayList = document.getElementById("replay-list");
    const emptyState = document.getElementById("empty-state");
    const playerContainer = document.getElementById("player-container");
    const video = document.getElementById("video");
    const replayInfoBar = document.getElementById("replay-info-bar");
    const replayFilename = document.getElementById("replay-filename");
    const replayFilesize = document.getElementById("replay-filesize");
    const confirmOverlay = document.getElementById("confirm-overlay");
    const confirmText = document.getElementById("confirm-text");

    let currentReplay = null;
    let pendingDelete = null;

    // ── Formatting helpers ──────────────────────────────────

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    }

    function formatDate(ms) {
      const d = new Date(ms);
      const now = new Date();
      const diffDays = Math.floor((now - d) / 86400000);

      const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      if (diffDays === 0) return `Today ${time}`;
      if (diffDays === 1) return `Yesterday ${time}`;
      if (diffDays < 7) return `${d.toLocaleDateString([], { weekday: "short" })} ${time}`;
      return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ` ${time}`;
    }

    function parseDateFromFilename(name) {
      // Filename format: YYYYMMDD_HHMMSS.mp4
      const m = name.match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/);
      if (!m) return null;
      return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
    }

    // ── Load and render ─────────────────────────────────────

    async function loadReplays() {
      const replays = await window.replays.list();
      const stats = await window.replays.stats();

      document.getElementById("replay-count").textContent = stats.count;
      document.getElementById("replay-size").textContent =
        (stats.totalBytes / (1024 ** 3)).toFixed(1);

      replayList.innerHTML = "";

      if (replays.length === 0) {
        replayList.innerHTML = `
          <div class="empty-state" style="padding-top:60px">
            <div class="empty-state-desc">
              No replays yet. Play a game with the tracker running to record your first replay.
            </div>
          </div>`;
        return;
      }

      for (const r of replays) {
        const item = document.createElement("div");
        item.className = "replay-item" + (currentReplay === r.name ? " active" : "");
        item.dataset.name = r.name;

        const dateStr = formatDate(r.mtime);
        const sizeStr = formatSize(r.size);

        item.innerHTML = `
          <div class="replay-item-info">
            <div class="replay-item-date">${dateStr}</div>
            <div class="replay-item-meta">${sizeStr}</div>
          </div>
          <div class="replay-item-actions">
            <button class="btn-delete" title="Delete replay">&times;</button>
          </div>`;

        item.addEventListener("click", (e) => {
          if (e.target.closest(".btn-delete")) {
            e.stopPropagation();
            showDeleteConfirm(r.name);
            return;
          }
          selectReplay(r);
        });

        replayList.appendChild(item);
      }
    }

    function selectReplay(replay) {
      currentReplay = replay.name;

      // Update sidebar selection
      document.querySelectorAll(".replay-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.name === replay.name);
      });

      // Show player
      emptyState.classList.add("hidden");
      playerContainer.classList.remove("hidden");
      replayInfoBar.classList.remove("hidden");

      // Load video via custom protocol
      video.src = `replay://video/${encodeURIComponent(replay.name)}`;
      video.load();

      replayFilename.textContent = replay.name;
      replayFilesize.textContent = formatSize(replay.size);
    }

    // ── Delete flow ─────────────────────────────────────────

    function showDeleteConfirm(filename) {
      pendingDelete = filename;
      confirmText.textContent = `Delete "${filename}"? This cannot be undone.`;
      confirmOverlay.classList.remove("hidden");
    }

    document.getElementById("btn-confirm-cancel").addEventListener("click", () => {
      confirmOverlay.classList.add("hidden");
      pendingDelete = null;
    });

    document.getElementById("btn-confirm-delete").addEventListener("click", async () => {
      if (pendingDelete) {
        await window.replays.delete(pendingDelete);
        if (currentReplay === pendingDelete) {
          currentReplay = null;
          video.src = "";
          emptyState.classList.remove("hidden");
          playerContainer.classList.add("hidden");
          replayInfoBar.classList.add("hidden");
        }
        pendingDelete = null;
      }
      confirmOverlay.classList.add("hidden");
      loadReplays();
    });

    confirmOverlay.addEventListener("click", (e) => {
      if (e.target === confirmOverlay) {
        confirmOverlay.classList.add("hidden");
        pendingDelete = null;
      }
    });

    // ── Buttons ─────────────────────────────────────────────

    document.getElementById("btn-open-folder").addEventListener("click", () => {
      window.replays.openFolder();
    });

    document.getElementById("btn-refresh").addEventListener("click", loadReplays);

    // ── Keyboard shortcuts ──────────────────────────────────

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !confirmOverlay.classList.contains("hidden")) {
        confirmOverlay.classList.add("hidden");
        pendingDelete = null;
      }
    });

    // ── Init ────────────────────────────────────────────────

    loadReplays();
  </script>
</body>
</html>
