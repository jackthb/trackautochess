<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>DAC Region Calibration</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; color: #c8c8c8; font-family: 'JetBrains Mono', monospace; overflow: hidden; height: 100vh; }

/* ── Toolbar ─────────────────────────────────────── */
#toolbar { position: fixed; top: 0; left: 0; right: 0; background: #0d0d0d;
  border-bottom: 1px solid #1a1a1a; padding: 0 16px; z-index: 20;
  display: flex; gap: 12px; align-items: center; font-size: 12px; height: 40px; }
#toolbar .sep { color: #2a2a2a; }

#toolbar .val { color: #4ade80; }
#toolbar .val.rgb { color: #f97316; }
#toolbar button, #toolbar select { background: #161616; color: #aaa; border: 1px solid #2a2a2a; padding: 4px 10px;
  cursor: pointer; font-family: inherit; font-size: 11px; border-radius: 2px; transition: all 0.15s; }
#toolbar button:hover, #toolbar select:hover { background: #222; color: #fff; border-color: #444; }
#toolbar select { padding: 4px 6px; }
#toolbar .drop-hint { color: #333; font-size: 11px; margin-left: auto; }

/* ── Left sidebar ────────────────────────────────── */
#left-panel { position: fixed; top: 40px; left: 0; width: 220px; bottom: 0;

#left-panel h2 { font-size: 10px; font-weight: 600; color: #444; text-transform: uppercase;

.screen-list { flex: 1; overflow-y: auto; padding: 0 0 8px; }
.screen-item { padding: 8px 12px; cursor: pointer; font-size: 11px; border-left: 3px solid transparent;

.screen-item.active { background: #0f1f0f; border-left-color: #4ade80; color: #4ade80; }

.screen-item .dot.partial { background: #f97316; }

.ar-toggle { display: flex; margin: 0 12px 8px; border: 1px solid #2a2a2a; border-radius: 2px; overflow: hidden; }

.screenshot-btns { display: flex; gap: 4px; }

.region-entry .del-btn { background: none; border: none; color: #333; cursor: pointer;

.region-entry .del-btn:hover { color: #ef4444; }
.region-entry .meta { font-size: 10px; color: #444; line-height: 1.6; }

.region-entry .assign-hint { font-size: 10px; color: #2a6; cursor: pointer; }

.region-entry.assigning { background: #0f1f0f; border-left: 3px solid #4ade80; }

.custom-region-entry { padding: 8px 14px; border-bottom: 1px solid #111; }

.custom-region-entry .name-input:focus { border-color: #4ade80; }

#panel-footer { padding: 10px 14px; border-top: 1px solid #1a1a1a; display: flex; gap: 6px; flex-wrap: wrap; }
#panel-footer button { flex: 1; background: #161616; color: #aaa; border: 1px solid #2a2a2a; padding: 6px 0;
  cursor: pointer; font-family: inherit; font-size: 11px; border-radius: 2px; transition: all 0.15s; min-width: 80px; }
#panel-footer button:hover { background: #222; color: #fff; border-color: #444; }
#panel-footer button.primary { background: #14532d; color: #4ade80; border-color: #166534; }
#panel-footer button.primary:hover { background: #166534; }
#panel-footer button.danger { color: #f87171; border-color: #7f1d1d; }
#panel-footer button.danger:hover { background: #1f0d0d; border-color: #991b1b; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #166534;
  color: #4ade80; padding: 8px 20px; border-radius: 3px; font-size: 12px; font-family: inherit;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
.toast.show { opacity: 1; }

.loupe { position: fixed; width: 140px; height: 140px; border: 1px solid #2a2a2a; background: #000;

.loupe-crosshair-h, .loupe-crosshair-v { position: absolute; background: rgba(74,222,128,0.3); pointer-events: none; }

input[type="file"] { display: none; }

<script>
// ── State ───────────────────────────────────────────────────────────────────

const viewport = document.getElementById('viewport');
const imgCanvas = document.getElementById('imgCanvas');
const imgCtx = imgCanvas.getContext('2d', { willReadFrequently: true });
const overlay = document.getElementById('overlay');
const loupeEl = document.getElementById('loupe');
const loupeCanvas = document.getElementById('loupeCanvas');
const loupeCtx = loupeCanvas.getContext('2d');
const regionsList = document.getElementById('regionsList');
const fileInput = document.getElementById('fileInput');
const screenshotFileInput = document.getElementById('screenshotFileInput');

let img = null;
let imgW = 0, imgH = 0;
let zoom = 1, panX = 0, panY = 0;
let dragging = false, dragStartX = 0, dragStartY = 0;
let selDiv = null;
let isPanning = false, panStartMX = 0, panStartMY = 0, panStartPX = 0, panStartPY = 0;

const DB_NAME = 'DACCalibration';
const DB_VERSION = 1;
const STORE_NAME = 'screenshots';
const CONFIG_STORE = 'config';

// ── IndexedDB for screenshots ───────────────────────────────────────────────

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      if (!db.objectStoreNames.contains(CONFIG_STORE)) db.createObjectStore(CONFIG_STORE);
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbPut(store, key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

async function dbGet(store, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbDelete(store, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

// ── Config management ───────────────────────────────────────────────────────

function mergeConfig(saved, defaults) {
  // Ensure saved config always has all screen_types from defaults
  if (!saved.screen_types) saved.screen_types = {};
  for (const [key, val] of Object.entries(defaults.screen_types)) {
    if (!saved.screen_types[key]) saved.screen_types[key] = val;
  }
  // Ensure all aspect ratios and their screenshots exist
  if (!saved.aspect_ratios) saved.aspect_ratios = {};
  for (const [ar, defaultAR] of Object.entries(defaults.aspect_ratios)) {
    if (!saved.aspect_ratios[ar]) {
      saved.aspect_ratios[ar] = defaultAR;
    } else {
      // Backfill screenshots from defaults if missing in saved
      const savedAR = saved.aspect_ratios[ar];
      if (!savedAR.screenshots || Object.keys(savedAR.screenshots).length === 0) {
        savedAR.screenshots = defaultAR.screenshots;
      }
    }
  }
  return saved;
}

async function loadConfig() {
  let saved = await dbGet(CONFIG_STORE, 'regions_config');
  if (saved) {
    config = mergeConfig(saved, JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
  } else {
    config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  }
  renderScreenList();
  renderPanel();
}

async function saveToStorage() {
  await dbPut(CONFIG_STORE, 'regions_config', config);
  showToast('Saved to browser storage');
}

async function resetConfig() {
  if (!confirm('Reset config to defaults? This clears any saved calibration data.')) return;
  await dbDelete(CONFIG_STORE, 'regions_config');
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  renderScreenList();
  renderPanel();
  showToast('Config reset to defaults');
}

function getARData() {
  return config.aspect_ratios[currentAR] || {};
}

function getScreenRegions() {
  const arData = getARData();
  return arData[currentScreen] || {};
}

function setScreenRegions(regions) {
  if (!config.aspect_ratios[currentAR]) config.aspect_ratios[currentAR] = {};
  config.aspect_ratios[currentAR][currentScreen] = regions;
}

function getExpectedRegions() {
  const st = config.screen_types[currentScreen];
  return st ? st.regions : {};
}

function getScreenshotKey() {
  return `${currentAR}__${currentScreen}`;
}

// ── Aspect ratio & screen selection ─────────────────────────────────────────

function setAspectRatio(ar) {
  currentAR = ar;
  document.querySelectorAll('.ar-toggle button').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === ar);
  });
  renderScreenList();
  renderPanel();
  loadScreenshot();
}

function setScreen(screen) {
  currentScreen = screen;
  assigningRegion = null;
  renderScreenList();
  renderPanel();
  loadScreenshot();
}

function renderScreenList() {
  const list = document.getElementById('screenList');
  list.innerHTML = '';
  const types = config.screen_types || {};
  for (const [key, info] of Object.entries(types)) {
    const item = document.createElement('div');
    item.className = 'screen-item' + (key === currentScreen ? ' active' : '');
    item.onclick = () => setScreen(key);

    // Status dot
    const expected = Object.keys(info.regions || {});
    const calibrated = config.aspect_ratios[currentAR]?.[key] || {};
    const calibratedCount = Object.keys(calibrated).filter(k => k !== 'screenshots').length;
    let dotClass = 'empty';
    if (calibratedCount > 0 && calibratedCount >= expected.length) dotClass = 'complete';
    else if (calibratedCount > 0) dotClass = 'partial';

    item.innerHTML = `<div class="dot ${dotClass}"></div><span>${info.description || key}</span>`;
    list.appendChild(item);
  }
}

// ── Screenshot persistence ──────────────────────────────────────────────────

function getConfigScreenshot() {
  const arData = config.aspect_ratios[currentAR];
  if (!arData || !arData.screenshots) return null;
  return arData.screenshots[currentScreen] || null;
}

function setConfigScreenshot(path) {
  const arData = config.aspect_ratios[currentAR];
  if (!arData.screenshots) arData.screenshots = {};
  arData.screenshots[currentScreen] = path;
}

async function loadScreenshot() {
  const thumb = document.getElementById('screenshotThumb');
  // Check IndexedDB override first
  const key = getScreenshotKey();
  const dbData = await dbGet(STORE_NAME, key);
  if (dbData) {
    thumb.innerHTML = `<img src="${dbData}">`;
    loadImage(dbData);
    return;
  }
  // Fall back to config file path
  const filePath = getConfigScreenshot();
  if (filePath) {
    thumb.innerHTML = `<img src="${filePath}">`;
    loadImage(filePath);
  } else {
    thumb.innerHTML = 'No screenshot';
  }
}

async function saveScreenshot(dataUrl) {
  const key = getScreenshotKey();
  await dbPut(STORE_NAME, key, dataUrl);
  const thumb = document.getElementById('screenshotThumb');
  thumb.innerHTML = `<img src="${dataUrl}">`;
}

async function clearScreenshot() {
  const key = getScreenshotKey();
  await dbDelete(STORE_NAME, key);
  setConfigScreenshot(null);
  document.getElementById('screenshotThumb').innerHTML = 'No screenshot';
}

function useLoadedAsScreenshot() {
  if (!img) return showToast('No image loaded');
  const c = document.createElement('canvas');
  c.width = imgW; c.height = imgH;
  c.getContext('2d').drawImage(img, 0, 0);
  const dataUrl = c.toDataURL('image/png');
  saveScreenshot(dataUrl);
  showToast('Screenshot saved');
}

screenshotFileInput.onchange = e => {
  if (e.target.files[0]) {
    const r = new FileReader();
    r.onload = ev => {
      saveScreenshot(ev.target.result);
      loadImage(ev.target.result);
    };
    r.readAsDataURL(e.target.files[0]);
  }
};

// ── Image loading ───────────────────────────────────────────────────────────

function loadImage(src) {
  const i = new Image();
  i.onload = () => {
    img = i; imgW = i.width; imgH = i.height;
    imgCanvas.width = imgW; imgCanvas.height = imgH;
    imgCtx.drawImage(i, 0, 0);
    viewport.classList.remove('empty');
    document.getElementById('dropHint').textContent = `${imgW}x${imgH}`;
    setZoom(fitZoom());
    renderRegionRects();
  };
  i.onerror = () => {
    console.error('Failed to load image:', src);
    showToast('Failed to load: ' + src.substring(0, 60));
  };
  i.src = src;
}

fileInput.onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };
function loadFile(f) { const r = new FileReader(); r.onload = e => loadImage(e.target.result); r.readAsDataURL(f); }

viewport.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
viewport.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

// ── Zoom & pan ──────────────────────────────────────────────────────────────

function fitZoom() {
  if (!img) return 1;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  return Math.min(vw / imgW, vh / imgH, 1);
}

function setZoom(z) {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const cx = vw / 2, cy = vh / 2;
  const imgCX = (cx - panX) / zoom, imgCY = (cy - panY) / zoom;
  zoom = Math.max(0.05, Math.min(z, 20));
  panX = cx - imgCX * zoom;
  panY = cy - imgCY * zoom;
  applyTransform();
  document.getElementById('zlevel').textContent = zoom < 1 ? zoom.toFixed(2) + 'x' : zoom.toFixed(1) + 'x';
}

function applyTransform() {
  const t = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  imgCanvas.style.transform = t;
  imgCanvas.style.transformOrigin = '0 0';
  overlay.style.transform = t;
  overlay.style.transformOrigin = '0 0';
  overlay.style.width = imgW + 'px';
  overlay.style.height = imgH + 'px';
  renderRegionRects();
}

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const imgX = (mx - panX) / zoom, imgY = (my - panY) / zoom;
  zoom = Math.max(0.05, Math.min(zoom * factor, 20));
  panX = mx - imgX * zoom;
  panY = my - imgY * zoom;
  applyTransform();
  document.getElementById('zlevel').textContent = zoom < 1 ? zoom.toFixed(2) + 'x' : zoom.toFixed(1) + 'x';
}, { passive: false });

// ── Mouse -> image coords ───────────────────────────────────────────────────

function mouseToImg(e) {
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const ix = (mx - panX) / zoom, iy = (my - panY) / zoom;
  return { mx, my, ix: Math.round(ix), iy: Math.round(iy), ixf: ix, iyf: iy };
}

// ── Loupe ───────────────────────────────────────────────────────────────────

function updateLoupe(e, pos) {
  if (!img) { loupeEl.style.display = 'none'; return; }
  loupeEl.style.display = 'block';
  const lx = e.clientX + 20, ly = e.clientY - 150;
  loupeEl.style.left = lx + 'px';
  loupeEl.style.top = ly + 'px';
  const loupeZoom = 8;
  const sw = 140 / loupeZoom, sh = 140 / loupeZoom;
  loupeCtx.imageSmoothingEnabled = false;
  loupeCtx.clearRect(0, 0, 140, 140);
  loupeCtx.drawImage(imgCanvas, pos.ixf - sw / 2, pos.iyf - sh / 2, sw, sh, 0, 0, 140, 140);
}

// ── Info bar ────────────────────────────────────────────────────────────────

function updateInfo(pos) {
  if (!img || pos.ix < 0 || pos.iy < 0 || pos.ix >= imgW || pos.iy >= imgH) {
    document.getElementById('px').textContent = '--';
    document.getElementById('frac').textContent = '--';
    document.getElementById('rgb').textContent = '--';
    return;
  }
  document.getElementById('px').textContent = `${pos.ix}, ${pos.iy}`;
  document.getElementById('frac').textContent = `${(pos.ix / imgW).toFixed(4)}, ${(pos.iy / imgH).toFixed(4)}`;
  const d = imgCtx.getImageData(pos.ix, pos.iy, 1, 1).data;
  document.getElementById('rgb').textContent = `${d[0]}, ${d[1]}, ${d[2]}`;
  document.getElementById('rgb').style.color = `rgb(${d[0]},${d[1]},${d[2]})`;
}

// ── Region drawing ──────────────────────────────────────────────────────────

viewport.addEventListener('mousedown', e => {
  if (!img) return;
  if (e.button === 1 || (e.button === 0 && e.altKey)) {
    isPanning = true;
    panStartMX = e.clientX; panStartMY = e.clientY;
    panStartPX = panX; panStartPY = panY;
    viewport.style.cursor = 'grabbing';
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;
  const pos = mouseToImg(e);
  dragging = true;
  dragStartX = pos.ixf; dragStartY = pos.iyf;
  selDiv = document.createElement('div');
  selDiv.className = 'sel-rect' + (assigningRegion ? ' assigning' : '');
  overlay.appendChild(selDiv);
});

viewport.addEventListener('mousemove', e => {
  if (isPanning) {
    panX = panStartPX + (e.clientX - panStartMX);
    panY = panStartPY + (e.clientY - panStartMY);
    applyTransform();
    return;
  }
  const pos = mouseToImg(e);
  updateInfo(pos);
  updateLoupe(e, pos);
  if (dragging && selDiv) {
    const x0 = Math.min(dragStartX, pos.ixf), y0 = Math.min(dragStartY, pos.iyf);
    const x1 = Math.max(dragStartX, pos.ixf), y1 = Math.max(dragStartY, pos.iyf);
    selDiv.style.left = x0 + 'px'; selDiv.style.top = y0 + 'px';
    selDiv.style.width = (x1 - x0) + 'px'; selDiv.style.height = (y1 - y0) + 'px';
  }
});

viewport.addEventListener('mouseup', e => {
  if (isPanning) {
    isPanning = false;
    viewport.style.cursor = 'crosshair';
    return;
  }
  if (!dragging || !selDiv) return;
  dragging = false;
  const pos = mouseToImg(e);
  let x0 = Math.min(dragStartX, pos.ixf), y0 = Math.min(dragStartY, pos.iyf);
  let x1 = Math.max(dragStartX, pos.ixf), y1 = Math.max(dragStartY, pos.iyf);
  x0 = Math.max(0, Math.round(x0)); y0 = Math.max(0, Math.round(y0));
  x1 = Math.min(imgW, Math.round(x1)); y1 = Math.min(imgH, Math.round(y1));

  overlay.removeChild(selDiv);
  selDiv = null;

  if (x1 - x0 < 3 || y1 - y0 < 3) return;

  const coords = [
    +(x0 / imgW).toFixed(5),
    +(y0 / imgH).toFixed(5),
    +(x1 / imgW).toFixed(5),
    +(y1 / imgH).toFixed(5)
  ];

  if (assigningRegion) {
    // Assign to expected region
    const regions = getScreenRegions();
    regions[assigningRegion] = coords;
    setScreenRegions(regions);
    assigningRegion = null;
    renderPanel();
    renderRegionRects();
    renderScreenList();
  } else {
    // Prompt for name
    const name = prompt('Region name:');
    if (!name) return;
    const regions = getScreenRegions();
    regions[name] = coords;
    setScreenRegions(regions);
    renderPanel();
    renderRegionRects();
    renderScreenList();
  }
});

viewport.addEventListener('mouseleave', () => { loupeEl.style.display = 'none'; });

// ── Render region rects on overlay ──────────────────────────────────────────

const REGION_COLORS = [
  '#f97316', '#38bdf8', '#a78bfa', '#f472b6', '#facc15',
  '#4ade80', '#fb923c', '#818cf8', '#e879f9', '#34d399'
];

function renderRegionRects() {
  overlay.querySelectorAll('.sel-rect').forEach(el => el.remove());
  const regions = getScreenRegions();
  let i = 0;
  for (const [name, coords] of Object.entries(regions)) {
    if (!Array.isArray(coords) || coords.length < 2) continue;
    const color = REGION_COLORS[i % REGION_COLORS.length];
    const div = document.createElement('div');
    div.className = 'sel-rect existing';
    div.style.borderColor = color;
    if (coords.length >= 4) {
      // 4-value region: [x0, y0, x1, y1]
      const px0 = coords[0] * imgW, py0 = coords[1] * imgH;
      const px1 = coords[2] * imgW, py1 = coords[3] * imgH;
      div.style.left = px0 + 'px'; div.style.top = py0 + 'px';
      div.style.width = (px1 - px0) + 'px'; div.style.height = (py1 - py0) + 'px';
    } else {
      // 2-value column range: [x_start, x_end] — render as full-height band
      const px0 = coords[0] * imgW, px1 = coords[1] * imgW;
      div.style.left = px0 + 'px'; div.style.top = '0px';
      div.style.width = (px1 - px0) + 'px'; div.style.height = imgH + 'px';
    }
    const label = document.createElement('span');
    label.className = 'sel-label';
    label.style.color = color;
    label.textContent = name;
    div.appendChild(label);
    overlay.appendChild(div);
    i++;
  }
}

// ── Panel ───────────────────────────────────────────────────────────────────

function renderPanel() {
  const expected = getExpectedRegions();
  const calibrated = getScreenRegions();
  const expectedNames = Object.keys(expected);
  const calibratedCount = Object.keys(calibrated).filter(k => expectedNames.includes(k)).length;

  document.getElementById('panelTitle').textContent =
    (config.screen_types[currentScreen]?.description || currentScreen) + ` (${currentAR})`;
  document.getElementById('regionCount').textContent = `${calibratedCount}/${expectedNames.length}`;

  regionsList.innerHTML = '';

  // Expected regions
  for (const [name, info] of Object.entries(expected)) {
    const coords = calibrated[name];
    const entry = document.createElement('div');
    entry.className = 'region-entry' + (assigningRegion === name ? ' assigning' : '');

    const hasCoords = Array.isArray(coords) && coords.length >= 2;
    const idx = Object.keys(expected).indexOf(name);
    const color = REGION_COLORS[idx % REGION_COLORS.length];

    let meta = '';
    if (hasCoords && coords.length >= 4) {
      meta = `<div class="meta">frac: <span>${coords[0].toFixed(4)}, ${coords[1].toFixed(4)} -> ${coords[2].toFixed(4)}, ${coords[3].toFixed(4)}</span></div>`;
    } else if (hasCoords) {
      meta = `<div class="meta">range: <span>${coords[0].toFixed(4)} -> ${coords[1].toFixed(4)}</span></div>`;
    }

    entry.innerHTML = `
      <div class="desc">${info.description || ''}</div>
      <div class="top-row">
        <div class="swatch" style="background:${hasCoords ? color : '#222'}"></div>
        <span class="region-name ${hasCoords ? '' : 'uncalibrated'}">${name}</span>
        ${hasCoords
          ? `<button class="del-btn" data-name="${name}">x</button>`
          : `<span class="assign-hint" data-name="${name}">[draw]</span>`
        }
      </div>
      ${meta}`;

    if (hasCoords) {
      entry.querySelector('.del-btn').addEventListener('click', () => {
        delete calibrated[name];
        setScreenRegions(calibrated);
        renderPanel();
        renderRegionRects();
        renderScreenList();
      });
    } else {
      entry.querySelector('.assign-hint').addEventListener('click', () => {
        assigningRegion = assigningRegion === name ? null : name;
        renderPanel();
      });
    }

    // Click region entry to start assigning
    entry.addEventListener('click', e => {
      if (e.target.closest('.del-btn') || e.target.closest('.assign-hint')) return;
      assigningRegion = assigningRegion === name ? null : name;
      renderPanel();
    });

    regionsList.appendChild(entry);
  }

  // Custom (non-expected) regions
  const customNames = Object.keys(calibrated).filter(k => !expectedNames.includes(k) && k !== 'screenshots');
  if (customNames.length > 0) {
    const divider = document.createElement('div');
    divider.style.cssText = 'padding: 8px 14px; font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid #1a1a1a;';
    divider.textContent = 'Custom regions';
    regionsList.appendChild(divider);

    customNames.forEach((name, i) => {
      const coords = calibrated[name];
      if (!Array.isArray(coords)) return;
      const color = REGION_COLORS[(expectedNames.length + i) % REGION_COLORS.length];
      const entry = document.createElement('div');
      entry.className = 'custom-region-entry';
      entry.innerHTML = `
        <div class="top-row">
          <div class="swatch" style="background:${color}; width:12px; height:12px; border:1px solid #333; border-radius:1px; flex-shrink:0;"></div>
          <input class="name-input" value="${name}" data-old="${name}">
          <button class="del-btn" style="background:none;border:none;color:#333;cursor:pointer;font-size:14px;" data-name="${name}">x</button>
        </div>
        <div style="font-size:10px;color:#444;margin-top:4px;">frac: <span style="color:#666;">${coords[0].toFixed(4)}, ${coords[1].toFixed(4)} -> ${coords[2].toFixed(4)}, ${coords[3].toFixed(4)}</span></div>`;

      entry.querySelector('.name-input').addEventListener('change', e => {
        const oldName = e.target.dataset.old;
        const newName = e.target.value.trim();
        if (newName && newName !== oldName) {
          calibrated[newName] = calibrated[oldName];
          delete calibrated[oldName];
          setScreenRegions(calibrated);
          renderPanel();
          renderRegionRects();
        }
      });
      entry.querySelector('.del-btn').addEventListener('click', () => {
        delete calibrated[name];
        setScreenRegions(calibrated);
        renderPanel();
        renderRegionRects();
        renderScreenList();
      });
      regionsList.appendChild(entry);
    });
  }
}

// ── Import / Export ─────────────────────────────────────────────────────────

function exportConfig() {
  const json = JSON.stringify(config, null, 2);
  navigator.clipboard.writeText(json).then(() => showToast('Config copied to clipboard'));
}

function importConfig() {
  const json = prompt('Paste regions_config.json content:');
  if (!json) return;
  try {
    config = JSON.parse(json);
    renderScreenList();
    renderPanel();
    renderRegionRects();
    showToast('Config imported');
  } catch (e) {
    showToast('Invalid JSON: ' + e.message);
  }
}

function clearCurrentRegions() {
  if (!confirm(`Clear all ${currentAR} regions for ${currentScreen}?`)) return;
  setScreenRegions({});
  renderPanel();
  renderRegionRects();
  renderScreenList();
}

// ── Toast ───────────────────────────────────────────────────────────────────

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// ── Init ────────────────────────────────────────────────────────────────────

loadConfig().then(() => {
  loadScreenshot();
});
</script>
</body></html>
