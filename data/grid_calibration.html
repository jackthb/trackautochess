.controls { margin-bottom: 12px; }

<div id="out">Waiting for clicks...</div>
<script>
const S = 4, RW = 402, RH = 115;
const wrap = document.getElementById("wrap");
const out = document.getElementById("out");
const statusEl = document.getElementById("status");
let lines = []; // {type:"v"|"h", val:number, el:Element, cls:string}
let dragging = null;

wrap.addEventListener("mousedown", function(e) {
  if (e.target.classList.contains("line")) return; // handled by line drag
  if (lines.length >= 3) return;
  const rect = wrap.getBoundingClientRect();
  const n = lines.length;
  if (n < 2) {
    const x = (e.clientX - rect.left) / S;
    const cls = n === 0 ? "l1" : "l2";
    addLine("v", x, cls);
  } else {
    const y = (e.clientY - rect.top) / S;
    addLine("h", y, "l3");
  }
  updateStatus();
  update();
});

function addLine(type, val, cls) {
  const el = document.createElement("div");
  el.className = "line " + (type === "v" ? "v" : "h") + " " + cls;
  if (type === "v") el.style.left = (val * S) + "px";
  else el.style.top = (val * S) + "px";
  wrap.appendChild(el);
  const line = {type, val, el, cls};
  lines.push(line);

  el.addEventListener("mousedown", function(e) {
    e.stopPropagation();
    dragging = line;
  });
}

document.addEventListener("mousemove", function(e) {
  if (!dragging) return;
  const rect = wrap.getBoundingClientRect();
  if (dragging.type === "v") {
    const x = Math.max(0, Math.min(RW, (e.clientX - rect.left) / S));
    dragging.val = x;
    dragging.el.style.left = (x * S) + "px";
  } else {
    const y = Math.max(0, Math.min(RH, (e.clientY - rect.top) / S));
    dragging.val = y;
    dragging.el.style.top = (y * S) + "px";
  }
  update();
});

document.addEventListener("mouseup", function() { dragging = null; });

document.getElementById("btnReset").addEventListener("click", function() {
  lines.forEach(l => l.el.remove());
  lines = [];
  updateStatus();
  update();
});

function updateStatus() {
  const msgs = ["Click left edge of first icon", "Click left edge of second icon", "Optional: click bottom edge of icon", "Done. Drag lines to adjust."];
  statusEl.textContent = msgs[Math.min(lines.length, 3)];
}

function update() {
  // Remove old derived lines
  wrap.querySelectorAll(".derived").forEach(el => el.remove());

  if (lines.length < 2) { out.textContent = "Place two vertical lines..."; return; }

  const vlines = lines.filter(l => l.type === "v");
  const start = Math.min(vlines[0].val, vlines[1].val);
  const spacing = Math.abs(vlines[1].val - vlines[0].val);
  if (spacing < 2) return;

  // Draw derived grid
  for (let n = 0; n < 12; n++) {
    const x = start + n * spacing;
    if (x > RW) break;
    // Skip if too close to a placed line
    if (vlines.some(v => Math.abs(v.val - x) < 2)) continue;
    const el = document.createElement("div");
    el.className = "derived";
    el.style.left = (x * S) + "px";
    wrap.appendChild(el);
  }

  let txt = "grid_start = " + start.toFixed(1) + " px\n";
  txt += "spacing    = " + spacing.toFixed(1) + " px\n\n";
  txt += "Python constants:\n";
  txt += "MM_UNIT_GRID_START_FRAC   = " + (start / RW).toFixed(4) + "\n";
  txt += "MM_UNIT_GRID_SPACING_FRAC = " + (spacing / RW).toFixed(4) + "\n";

  const hlines = lines.filter(l => l.type === "h");
  if (hlines.length > 0) {
    txt += "\nicon_bottom = " + hlines[0].val.toFixed(1) + " px  (frac=" + (hlines[0].val / RH).toFixed(4) + ")\n";
  }

  txt += "\nSlot left-edges:\n";
  for (let n = 0; n < 12; n++) {
    const x = start + n * spacing;
    if (x > RW) break;
    txt += "  slot " + n + ": x=" + x.toFixed(1) + "\n";
  }
  out.textContent = txt;
}
</script>
