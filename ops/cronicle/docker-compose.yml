services:
  cronicle:
    image: soulteary/cronicle:0.9.80
    container_name: dac-cronicle
    hostname: dac-cronicle
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      CRONICLE_base_app_url: ${CRONICLE_BASE_APP_URL:-http://localhost:3012}
    ports:
      - "${CRONICLE_PORT:-3012}:3012"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../:/workspace:rw
      - ./scripts:/opt/cronicle/dac-scripts:ro
      - ./data/data:/opt/cronicle/data:rw
      - ./data/logs:/opt/cronicle/logs:rw
      - ./data/plugins:/opt/cronicle/plugins:rw
