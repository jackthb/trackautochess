<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.trow { display: flex; gap: 14px; align-items: stretch; }
.tier { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; background: var(--bg-surface); border: 1px solid var(--border); }
.plate {
  width: 56px; height: 56px;
  font-family: 'Cinzel', serif;
  font-size: 28px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid;
}
.tname { font-size: 10px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; }
.thex { font-size: 10px; color: var(--text-secondary); }
</style>
<div class="trow">
  <div class="tier"><div class="plate" style="color:#c9a84c;border-color:#c9a84c">1</div><div class="tname">gold · 1st</div><div class="thex">#C9A84C</div></div>
  <div class="tier"><div class="plate" style="color:#8a92a8;border-color:#8a92a8">2</div><div class="tname">silver · 2nd</div><div class="thex">#8A92A8</div></div>
  <div class="tier"><div class="plate" style="color:#8b6d4f;border-color:#8b6d4f">3</div><div class="tname">bronze · 3rd</div><div class="thex">#8B6D4F</div></div>
  <div class="tier"><div class="plate" style="color:#e4e7ee;border-color:#e4e7ee;opacity:.9">4</div><div class="tname">text-primary</div><div class="thex">4–8th</div></div>
  <div class="tier"><div class="plate" style="color:#8a7234;border-color:#8a7234">—</div><div class="tname">gold-dim</div><div class="thex">#8A7234</div></div>
</div>
</div></body></html>
