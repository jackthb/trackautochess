<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.stack { display: flex; flex-direction: column; gap: 14px; }
.lbl-row { display: flex; align-items: baseline; gap: 20px; padding: 10px 14px; background: var(--bg-surface); border: 1px solid var(--border-subtle); }
.l-hero { font-size: 13px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
.l-sec { font-size: 13px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
.l-lbl { font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
.meta { margin-left:auto; font-size:10px; color:var(--text-muted); letter-spacing:0.5px; font-family:monospace; }
.note { font-size: 11px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
</style>
<div class="stack">
  <div class="lbl-row"><span class="l-hero">SEASON HISTORY</span><span class="meta">13 / 2px tr — h-section</span></div>
  <div class="lbl-row"><span class="l-sec">Match Players</span><span class="meta">13 / 1.5px tr — section</span></div>
  <div class="lbl-row"><span class="l-lbl">LINEUP</span><span class="meta">11 / 1px tr — h-label</span></div>
</div>
<div class="note">Tracked-out uppercase is the system's primary hierarchy signal — not size, not weight. Use on all section titles, field labels, and stat units.</div>
</div></body></html>
