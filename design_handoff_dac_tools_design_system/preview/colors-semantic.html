<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.sw { border: 1px solid var(--border); background: var(--bg-surface); }
.sw-chip { height: 56px; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:1px; }
.sw-meta { padding: 7px 10px; border-top: 1px solid var(--border-subtle); }
.sw-name { font-size: 11px; color: var(--text-primary); }
.sw-hex { font-size: 10px; color: var(--text-muted); }
.examples { display:flex; gap:16px; margin-top:14px; font-size:13px; font-family:'JetBrains Mono',monospace; }
</style>
<div class="grid">
  <div class="sw"><div class="sw-chip" style="background:#3a7a4a;color:#fff">OK</div><div class="sw-meta"><div class="sw-name">green</div><div class="sw-hex">#3A7A4A</div></div></div>
  <div class="sw"><div class="sw-chip" style="background:#262a3a;color:#4eaa62">▲ +1</div><div class="sw-meta"><div class="sw-name">green-bright</div><div class="sw-hex">#4EAA62</div></div></div>
  <div class="sw"><div class="sw-chip" style="background:#9b3a3a;color:#fff">ERR</div><div class="sw-meta"><div class="sw-name">red</div><div class="sw-hex">#9B3A3A</div></div></div>
  <div class="sw"><div class="sw-chip" style="background:#262a3a;color:#c44e4e">▼ −1</div><div class="sw-meta"><div class="sw-name">red-bright</div><div class="sw-hex">#C44E4E</div></div></div>
</div>
<div class="examples">
  <span><span style="color:#4eaa62">7</span><span style="color:#5c6278"> – </span><span style="color:#c44e4e">2</span></span>
  <span style="color:#5c6278">W–L convention</span>
</div>
</div></body></html>
