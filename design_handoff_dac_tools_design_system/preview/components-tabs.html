<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.tab-bar { display:flex; background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 0 16px; }
.tab { padding: 11px 20px; font-family: 'JetBrains Mono',monospace; font-size: 13px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; position: relative; }
.tab:hover { color: var(--text-secondary); }
.tab.active { color: var(--text-primary); border-bottom-color: #E0402A; }
.badge { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: #4eaa62; }
.note { font-size: 11px; color: var(--text-secondary); margin-top: 14px; line-height: 1.5; }
</style>
<div class="tab-bar">
  <div class="tab active">History</div>
  <div class="tab">Replays</div>
  <div class="tab">Confirm <span class="badge"></span></div>
  <div class="tab">Settings</div>
  <div class="tab">Log</div>
</div>
<div class="note">Active tab: 2px accent underline + <b style="color:var(--text-primary)">text-primary</b>. Hover: promotes from muted to secondary. Pending-work indicator: 7px green dot, top-right of the tab label.</div>
</div></body></html>
