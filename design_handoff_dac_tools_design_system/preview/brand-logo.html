<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.wrap { display:flex; flex-direction:column; gap:16px; }
.logo-wrap { display:flex; align-items:center; gap: 18px; background: var(--bg-surface); border: 1px solid var(--border); padding: 14px 16px; }
.logo-img { width: 56px; height: 56px; }
.logo-text { font-family:'Cinzel',serif; font-size: 20px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: #9096ac; }
.logo-text b { color: #CC3520; font-weight: 600; }
.desc { font-size: 11px; color: var(--text-secondary); line-height: 1.6; }
.sizes { display:flex; gap: 18px; align-items: center; }
</style>
<div class="wrap">
  <div class="logo-wrap">
    <img class="logo-img" src="../assets/logo.svg" alt="DAC Tools logo"/>
    <div>
      <div class="logo-text"><b>DAC</b> Tools</div>
      <div class="desc" style="margin-top:4px">Bishop chess piece, diagonally sliced in 3 tiles, ember gradient.</div>
    </div>
  </div>
  <div class="sizes">
    <img src="../assets/logo.svg" style="width:20px;height:20px"/>
    <img src="../assets/logo.svg" style="width:28px;height:28px"/>
    <img src="../assets/logo.svg" style="width:40px;height:40px"/>
    <span class="desc">Logo — 20 / 28 / 40 px. Never recolor.</span>
  </div>
</div>
</div></body></html>
