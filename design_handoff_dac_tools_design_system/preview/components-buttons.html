<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.row { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
.btn {
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  padding: 7px 18px;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  cursor:pointer;
  border-radius: 8px;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.btn:hover { color: var(--text-secondary); border-color: var(--text-muted); }
.btn.primary { color: #1e2130; background: #E0402A; border-color: #E0402A; }
.btn.primary:hover { opacity: 0.9; }
.btn.confirm { color: #e4e7ee; background: #3a7a4a; border-color: #4eaa62; font-weight:600; padding: 8px 24px; }
.btn.danger { color: #fff; background: #9b3a3a; border-color: #9b3a3a; }
.btn.danger:hover { background: #c44e4e; }
.btn.ss { padding: 4px 14px; font-size: 12px; background: var(--bg-surface); color: var(--text-secondary); }
.btn.ss-danger { color: #c44e4e; border-color: #c44e4e; }
.meta { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 12px; }
</style>
<div class="meta">Ghost · Primary · Confirm · Danger</div>
<div class="row" style="margin-top:8px">
  <button class="btn">Refresh</button>
  <button class="btn primary">Save</button>
  <button class="btn confirm">Confirm</button>
  <button class="btn danger">Delete</button>
</div>
<div class="meta" style="margin-top:16px">Small · Destructive small · Disabled</div>
<div class="row" style="margin-top:8px">
  <button class="btn ss">Copy</button>
  <button class="btn ss ss-danger">Remove</button>
  <button class="btn" disabled style="opacity:0.5;cursor:default">Refreshing…</button>
</div>
</div></body></html>
