<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.stack { display: flex; flex-direction: column; gap: 10px; }
.line { display: flex; align-items: baseline; gap: 16px; padding: 8px 12px; background: var(--bg-surface); border: 1px solid var(--border-subtle); }
.sample { font-family: var(--font-mono); font-size: 16px; min-width: 220px; }
.meta { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-left: auto; }
.hex { font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
</style>
<div class="stack">
  <div class="line"><span class="sample" style="color:#e4e7ee">The quick brown fox</span><span class="meta">text-primary</span><span class="hex">#E4E7EE</span></div>
  <div class="line"><span class="sample" style="color:#9096ac">The quick brown fox</span><span class="meta">text-secondary</span><span class="hex">#9096AC</span></div>
  <div class="line"><span class="sample" style="color:#5c6278">The quick brown fox</span><span class="meta">text-muted</span><span class="hex">#5C6278</span></div>
  <div class="line"><span class="sample" style="color:#ffffff">Pure white (hover only)</span><span class="meta">fff</span><span class="hex">#FFFFFF</span></div>
</div>
</div></body></html>
