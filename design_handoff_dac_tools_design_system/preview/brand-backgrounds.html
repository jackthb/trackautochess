<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.wrap { display:flex; flex-direction:column; gap: 14px; }
.demo { position: relative; height: 120px; background: #1e2130; border: 1px solid var(--border); overflow: hidden; border-radius: 8px; }
.demo::before { content:''; position:absolute; inset:0; opacity:0.08; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size: 256px 256px; }
.demo.grid::after {
  content:''; position:absolute; inset:0;
  background-image: linear-gradient(#2f3346 1px, transparent 1px), linear-gradient(90deg, #2f3346 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 65%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 65%);
}
.glow { position:absolute; width: 300px; height: 300px; top:50%; left:50%; transform: translate(-50%,-50%); border-radius:50%; background: radial-gradient(circle, rgba(224,64,42,0.15) 0%, transparent 70%); filter: blur(20px); }
.tag { position: absolute; top: 8px; left: 10px; font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; z-index: 2; }
.note { font-size: 11px; color: var(--text-secondary); line-height: 1.6; }
</style>
<div class="wrap">
  <div class="demo"><span class="tag">Noise overlay · opacity 0.03</span></div>
  <div class="demo grid"><span class="tag">Chessboard grid + radial mask (landing)</span><div class="glow"></div></div>
  <div class="note">Two background layers: (1) an always-on SVG fractal-noise at 3% opacity; (2) a landing-only 64px chessboard grid faded to a vignette, with a barely-visible ember glow.</div>
</div>
</div></body></html>
