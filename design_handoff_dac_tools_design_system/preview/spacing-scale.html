<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.row { display:flex; gap: 14px; align-items: flex-end; }
.s { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar { background: #E0402A; width: 28px; }
.s2 { height: 2px; } .s4 { height: 4px; } .s6 { height: 6px; } .s8 { height: 8px; }
.s12 { height: 12px; } .s16 { height: 16px; } .s20 { height: 20px; } .s24 { height: 24px; }
.s32 { height: 32px; } .s48 { height: 48px; }
.name { font-size: 9px; color: var(--text-muted); letter-spacing: 0.5px; font-family: monospace; }
.note { font-size: 11px; color: var(--text-secondary); margin-top: 14px; line-height: 1.5; }
</style>
<div class="row">
  <div class="s"><div class="bar s2"></div><div class="name">2</div></div>
  <div class="s"><div class="bar s4"></div><div class="name">4</div></div>
  <div class="s"><div class="bar s6"></div><div class="name">6</div></div>
  <div class="s"><div class="bar s8"></div><div class="name">8</div></div>
  <div class="s"><div class="bar s12"></div><div class="name">12</div></div>
  <div class="s"><div class="bar s16"></div><div class="name">16</div></div>
  <div class="s"><div class="bar s20"></div><div class="name">20</div></div>
  <div class="s"><div class="bar s24"></div><div class="name">24</div></div>
  <div class="s"><div class="bar s32"></div><div class="name">32</div></div>
  <div class="s"><div class="bar s48"></div><div class="name">48</div></div>
</div>
<div class="note">Common gaps: <b style="color:var(--text-primary)">4–6px</b> between adjacent icons, <b style="color:var(--text-primary)">10–16px</b> between form fields, <b style="color:var(--text-primary)">20–24px</b> for section padding, <b style="color:var(--text-primary)">32px</b> for page gutters.</div>
</div></body></html>
