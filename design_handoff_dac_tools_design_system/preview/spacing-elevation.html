<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.stack { display:flex; flex-direction:column; gap:12px; }
.tip {
  display: inline-block;
  background: #2f3346;
  border: 1px solid #3a405a;
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
  font-size: 11px;
  color: var(--text-primary);
  max-width: 240px;
}
.tip-title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 2px; }
.tip-sub { font-size: 10px; color: var(--text-secondary); }
.note { font-size: 11px; color: var(--text-secondary); line-height: 1.6; }
.note b { color: var(--text-primary); }
.flash {
  display:inline-block; margin-top: 6px;
  background: rgba(224,64,42,0.25); padding: 6px 12px; font-size: 11px; color: var(--text-primary);
}
</style>
<div class="stack">
  <div class="row" style="gap: 18px">
    <div class="tip">
      <div class="tip-title">Razor</div>
      <div class="tip-sub">Cost 4 · Hunter / Warlock</div>
    </div>
    <div class="note">
      <b>Tooltip shadow</b> — the only deep shadow in the system.<br/>
      <code style="color:var(--text-muted);font-size:10px">0 8px 32px rgba(0,0,0,0.6),<br/>0 0 0 1px rgba(255,255,255,0.04)</code>
    </div>
  </div>
  <div class="note">
    <b>Highlight flash</b> — 2s ease-out fade when a match newly appears:
    <div class="flash">Match #4821 imported</div>
  </div>
</div>
</div></body></html>
