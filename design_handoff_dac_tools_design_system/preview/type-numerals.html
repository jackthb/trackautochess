<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.wrap { display:flex; flex-direction:column; gap:14px; }
.plate-row { display:flex; gap: 12px; align-items:center; }
.plate {
  width: 56px; height: 56px;
  font-family: 'Cinzel', serif;
  font-size: 28px; font-weight: 700;
  display:flex; align-items:center; justify-content:center;
  border: 1px solid;
}
.desc { font-size: 11px; color: var(--text-secondary); line-height: 1.6; }
.desc b { color: var(--text-primary); }
.stars-row { display:flex; gap: 18px; margin-top: 6px; align-items:center; }
.star { background:#1e2130; padding: 3px 6px; border-radius: 4px; font-size: 10px; }
.star.s2 { color: #5a8fd5; }
.star.s3 { color: #c9a84c; }
</style>
<div class="wrap">
  <div class="plate-row">
    <div class="plate" style="color:#c9a84c;border-color:#c9a84c">1</div>
    <div class="plate" style="color:#8a92a8;border-color:#8a92a8">2</div>
    <div class="plate" style="color:#8b6d4f;border-color:#8b6d4f">3</div>
    <div class="plate" style="color:#e4e7ee;border-color:#e4e7ee;opacity:.9">8</div>
    <div class="desc">
      <b>Cinzel placement numeral</b><br/>
      52×52 box · 1px colored border · 28px bold
    </div>
  </div>
  <div class="stars-row">
    <span class="star s2">★★</span>
    <span class="star s3">★★★</span>
    <span class="desc">Unit star tier — 9px bg-deep chip, blue at 2★, gold at 3★</span>
  </div>
</div>
</div></body></html>
