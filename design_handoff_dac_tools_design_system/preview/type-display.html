<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body><div class="card">
<style>
.specimen { display: flex; flex-direction: column; gap: 16px; }
.row-type { display: flex; align-items: baseline; gap: 20px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; }
.hero { font-family: 'Cinzel', serif; font-weight: 700; font-size: 42px; letter-spacing: 6px; text-transform: uppercase; line-height: 1; color: #E0402A; }
.hero b { color: #9096ac; font-weight: 700; margin-left: 6px; }
.meta { margin-left: auto; font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; text-align: right; line-height: 1.5; }
.logo { font-family: 'Cinzel', serif; font-weight: 600; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; color: #9096ac; }
.logo b { color: #CC3520; font-weight: 600; }
</style>
<div class="specimen">
  <div class="row-type">
    <div class="hero">DAC <b>TOOLS</b></div>
    <div class="meta">Cinzel 700<br/>42px / 10px tracking<br/>Hero / landing</div>
  </div>
  <div class="row-type">
    <div class="logo"><b>DAC</b> Tracker</div>
    <div class="meta">Cinzel 600<br/>18px / 3px tracking<br/>Nav + titlebar logo</div>
  </div>
</div>
</div></body></html>
